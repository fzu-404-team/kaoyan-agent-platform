        <div class="form-item"><label for="pf-major">目标专业</label><input class="input" id="pf-major" name="major" value="${esc(p.major)}" placeholder="未设置"></div>
        <div class="form-item"><label for="pf-year">考试年份</label><select class="select" id="pf-year" name="year">${['2026', '2027', '2028'].map(y => `<option ${p.year === y ? 'selected' : ''}>${y}</option>`).join('')}</select></div>
        <div class="form-item"><span class="lab">学位类型</span><div class="chips" role="radiogroup">${['学硕', '专硕', '未设置'].map(d => `<button type="button" class="chip" data-act="pf-degree" data-arg="${d}" aria-pressed="${p.degree === d}">${d}</button>`).join('')}</div></div>
        <div class="form-item full"><label for="pf-bg">背景说明</label><textarea class="textarea" id="pf-bg" name="bg">${esc(p.bg)}</textarea></div>
      </div>
      <div class="row" style="margin-top:16px"><span class="spacer"></span><button class="key ink sm" type="submit">保存档案</button></div>
    </form>
    <section class="card pad" style="margin-top:20px" aria-labelledby="t-data">
      <div class="card-h"><h2 id="t-data">数据与隐私</h2></div>
      <div class="row"><button class="key sm" data-act="toast" data-arg="已生成个人数据导出（原型不下载文件）">导出我的数据</button><button class="key sm" data-act="privacy">助手隐私设置</button>${state.user.role === 'ADMIN' ? '' : '<button class="link small" data-act="become-admin">原型：切换为管理员视角</button>'}</div>
    </section>
    <div class="row" style="margin-top:20px"><button class="key sm danger" data-act="logout">退出登录</button></div>
  </div>`, { mobileTitle: '个人中心' })
}
ACTIONS['pf-degree'] = el => { state.profile.degree = el.dataset.arg; $$('[data-act="pf-degree"]').forEach(b => b.setAttribute('aria-pressed', b.dataset.arg === el.dataset.arg)) }
FORMS.profile = f => { Object.assign(state.profile, { school: f.school.value, major: f.major.value, year: f.year.value, bg: f.bg.value }); toast('档案已保存') }
ACTIONS['become-admin'] = () => { state.user.role = 'ADMIN'; toast('已切换为管理员视角（原型）'); render() }

/* ---------------- 更多（手机底部导航） ---------------- */
VIEWS.more = () => {
  const groups = state.user.role === 'ADMIN' ? [...NAV, ADMIN_NAV] : NAV
  return shell('more', `<div class="page">
    ${pageHead('更多', '')}
    <button class="card row" data-act="go" data-arg="profile" style="width:100%;border:0;padding:16px;margin-bottom:18px;cursor:pointer;text-align:left"><span class="avatar">${esc(state.user.name[0])}</span><span><b>${esc(state.user.name)}</b><br><small class="faint">个人中心 · 备考档案</small></span><span class="spacer"></span><span class="faint">›</span></button>
    ${groups.map(([g, items]) => `<div class="more-group"><div class="label">${g}</div><div class="card">${items.map(([r, n, ic]) => `<button class="more-item" data-act="go" data-arg="${r}"><i>${ic}</i>${n}<span>›</span></button>`).join('')}</div></div>`).join('')}
    <button class="key sm danger" data-act="logout">退出登录</button>
  </div>`, { mobileTitle: '更多' })
}

/* ---------------- 管理：资料审核 ---------------- */
VIEWS['admin-docs'] = () => {
  if (state.user.role !== 'ADMIN') return forbidden()
  return shell('admin-docs', `<div class="page">
    ${pageHead('资料审核', '核对来源与使用权限后再发布；驳回需填写原因。')}
    <section class="card pad"><div class="table-wrap"><table class="t">
      <thead><tr><th>标题</th><th>科目</th><th>状态</th><th>创建时间</th><th>操作</th></tr></thead>
      <tbody>${state.adminDocs.map(d => `<tr><td>${esc(d.title)}</td><td>${d.s}</td><td><span class="badge ${d.status === '已通过' ? 'green' : d.status === '已拒绝' ? 'red' : 'ochre'}">${d.status}</span></td><td>${d.when}</td>
        <td>${d.status === '待审核' ? `<div class="row" style="gap:8px"><button class="key xs" data-act="doc-approve" data-arg="${d.id}">通过</button><button class="key xs danger" data-act="doc-reject" data-arg="${d.id}">拒绝</button></div>` : '<span class="faint">—</span>'}</td></tr>`).join('')}</tbody>
    </table></div></section>
  </div>`)
}
function forbidden() {
  return shell('home', `<div class="page"><div class="card">${empty('没有访问权限', '这个页面只对管理员开放。', '<button class="key sm" data-act="go" data-arg="home">回到首页</button>')}</div></div>`)
}
ACTIONS['doc-approve'] = el => { state.adminDocs.find(d => d.id === el.dataset.arg).status = '已通过'; toast('已通过，资料已发布'); render() }
ACTIONS['doc-reject'] = el => openModal(`<h2>拒绝这份资料</h2><div class="form-item" style="margin-top:12px"><label for="rej">拒绝原因（必填）</label><textarea class="textarea" id="rej" placeholder="例如：来源未登记，无法确认使用权限"></textarea><div class="err" id="rej-err"></div></div>
  <div class="modal-foot"><button class="key sm" data-act="close-modal">取消</button><button class="key sm danger" data-act="doc-reject-ok" data-arg="${el.dataset.arg}">拒绝</button></div>`)
ACTIONS['doc-reject-ok'] = el => {
  const v = $('#rej').value.trim()
  if (!v) { $('#rej').classList.add('invalid'); $('#rej-err').textContent = '请填写拒绝原因'; return }
  state.adminDocs.find(d => d.id === el.dataset.arg).status = '已拒绝'
  closeModal(); toast('已拒绝'); render()
}

/* ---------------- 管理：题目录入与审核 ---------------- */
const ADMIN_TABS = ['待审核列表', '录入题目', '批量导入']
VIEWS['admin-questions'] = () => {
  if (state.user.role !== 'ADMIN') return forbidden()
  const tab = state.adminTab
  return shell('admin-questions', `<div class="page wide">
    ${pageHead('题目录入与审核', '核对题目、来源与使用权限后，再发布给学生练习。')}
    <div class="tabs" role="tablist" style="margin-bottom:18px">${ADMIN_TABS.map(t => `<button class="tab" role="tab" data-act="admin-tab" data-arg="${t}" aria-selected="${tab === t}">${t}${t === '待审核列表' ? ` · ${state.adminQ.filter(q => q.status === '待审核').length}` : ''}</button>`).join('')}</div>
    ${tab === '待审核列表' ? adminReview() : tab === '录入题目' ? adminEntry() : adminImport()}
  </div>`)
}
function adminReview() {
  const pending = state.adminQ.filter(q => q.status === '待审核')
  const q = state.adminQ.find(x => x.id === state.adminQId && x.status === '待审核') || pending[0]
  if (!q) return `<div class="card">${empty('没有待审核题目', '新录入或导入的题目会出现在这里。', '<button class="key sm" data-act="admin-tab" data-arg="录入题目">录入题目</button>')}</div>`
  const noSrc = !q.srcName && !q.srcLoc && !q.license
  return `<div class="admin-detail">
    <section class="card pad" aria-label="题目详情">
      <div class="row" style="margin-bottom:8px"><span class="badge">#${q.id}</span><span class="badge">${q.s}</span><span class="badge">${q.d}</span><span class="faint small">${q.k} · ${q.when} 送审</span></div>
      <p class="stem">${esc(q.stem)}</p>
      ${q.opts.map((t, j) => `<div class="ropt ${j === q.a ? 'right' : ''}"><b>${LETTERS[j]}</b><span>${esc(t)}</span>${j === q.a ? '<em>标准答案</em>' : ''}</div>`).join('')}
      <p style="margin:12px 0 0"><b>解析：</b>${esc(q.why)}</p>
      <div class="hr"></div>
      <div class="label">来源与使用权限</div>
      ${noSrc ? '<p class="notice warn" style="margin:0 0 10px">来源字段为空：通过前请补充来源名称、定位和使用权限；公开可读不等于允许复制发布。</p>' : ''}
      <dl class="src-grid"><dt>来源类别</dt><dd>${q.srcType}</dd><dt>来源名称</dt><dd>${esc(q.srcName) || '<span class="pending">未填写</span>'}</dd><dt>来源定位</dt><dd>${esc(q.srcLoc) || '<span class="pending">未填写</span>'}</dd><dt>使用权限</dt><dd>${esc(q.license) || '<span class="pending">未填写</span>'}</dd></dl>
    </section>
    <aside class="stack" style="gap:16px">
      <section class="card pad" aria-label="审核">
        <div class="form-item"><label for="rv">审核意见（驳回必填）</label><textarea class="textarea" id="rv" placeholder="通过前请核对题干、四个选项、答案、解析和使用权限。"></textarea><div class="err" id="rv-err"></div></div>
        <div class="row" style="margin-top:14px"><button class="key sm danger" data-act="q-reject" data-arg="${q.id}">驳回题目</button><span class="spacer"></span><button class="key ink sm" data-act="q-approve" data-arg="${q.id}" ${noSrc ? 'disabled title="请先补充来源与使用权限"' : ''}>审核通过</button></div>
        ${noSrc ? '<p class="faint small" style="margin:10px 0 0">来源未补全时不能通过。</p>' : ''}
      </section>
      <section class="card pad" aria-label="待审核列表">
        <div class="label">待审核（${pending.length}）</div>
        <div class="stack" style="gap:4px">${pending.map(x => `<button class="list-btn" data-act="pick-q" data-arg="${x.id}" ${x.id === q.id ? 'aria-current="true"' : ''}><b style="font-size:14px">${esc(x.stem.slice(0, 22))}…</b><small>#${x.id} · ${x.s} · ${x.when}</small></button>`).join('')}</div>
      </section>
    </aside>
  </div>`
}
function adminEntry() {
  const sel = (name, label, opts) => `<div class="form-item"><label for="qe-${name}">${label}</label><select class="select" id="qe-${name}" name="${name}">${opts.map(o => `<option>${o}</option>`).join('')}</select></div>`
  const inp = (name, label, ph = '', full = false) => `<div class="form-item ${full ? 'full' : ''}"><label for="qe-${name}">${label}</label><input class="input" id="qe-${name}" name="${name}" placeholder="${ph}"><div class="err" data-err="${name}"></div></div>`
  return `<form class="card pad" data-form="q-entry" novalidate>
    <div class="form-grid">
      ${sel('s', '科目', SUBJECTS)}${sel('d', '难度', ['简单', '中等', '困难'])}
      ${inp('k', '知识点', '例如：进程同步 · 信号量', true)}
      <div class="form-item full"><label for="qe-stem">题干</label><textarea class="textarea" id="qe-stem" name="stem"></textarea><div class="err" data-err="stem"></div></div>
      ${LETTERS.map(L => inp('o' + L, '选项 ' + L)).join('')}
      ${sel('a', '标准答案', LETTERS)}${sel('srcType', '来源类别', ['自编题', '模拟题', '真题', '课程习题'])}
      <div class="form-item full"><label for="qe-why">解析</label><textarea class="textarea" id="qe-why" name="why"></textarea><div class="err" data-err="why"></div></div>
      ${inp('srcName', '来源名称／试卷名称', '填写真实试卷、出版物或自编记录名称')}${inp('srcLoc', '来源定位', '原文地址、页码、章节或自编记录位置')}
      ${inp('license', '使用权限说明', '填写授权依据或自编署名；公开可读不等于允许复制发布', true)}
    </div>
    <p class="notice" style="margin:16px 0 0">保存后进入待审核；审核通过后才会进入学生题池。请核对内容来源与使用权限。</p>
    <div class="row" style="margin-top:16px"><span class="spacer"></span><button class="key sm" type="button" data-act="admin-tab" data-arg="待审核列表">取消录入</button><button class="key ink sm" type="submit">保存并送审</button></div>
  </form>`
}
function adminImport() {
  return `<section class="card pad">
    <div class="dropzone"><b class="serif" style="font-size:17px">拖入 JSON 文件，或</b> <button class="key sm" data-act="mock-import" style="margin-left:8px">选择文件</button><p class="faint small" style="margin:10px 0 0">每题需含题干、四个选项、答案、解析和六项来源字段；导入后全部进入待审核。</p></div>
    <div class="row" style="margin-top:14px"><button class="link small" data-act="toast" data-arg="原型：下载导入示例 question-import-example.json">下载导入示例</button></div>
  </section>`
}
ACTIONS['admin-tab'] = el => { state.adminTab = el.dataset.arg; render() }
ACTIONS['pick-q'] = el => { state.adminQId = Number(el.dataset.arg); render() }
ACTIONS['q-approve'] = el => { state.adminQ.find(q => q.id === Number(el.dataset.arg)).status = '已发布'; toast('审核通过，题目已进入学生题池'); render() }
ACTIONS['q-reject'] = el => {
  const v = $('#rv').value.trim()
  if (!v) { $('#rv').classList.add('invalid'); $('#rv-err').textContent = '驳回时必须填写审核意见'; $('#rv').focus(); return }
  state.adminQ.find(q => q.id === Number(el.dataset.arg)).status = '已驳回'
  toast('已驳回，录入人可修改后重新送审'); render()
}
FORMS['q-entry'] = f => {
  const need = ['k', 'stem', 'oA', 'oB', 'oC', 'oD', 'why', 'srcName', 'srcLoc', 'license']
  let bad = 0
  need.forEach(k => { const v = f[k].value.trim(); f[k].classList.toggle('invalid', !v); const e = $(`[data-err="${k}"]`, f); if (e) e.textContent = v ? '' : '必填'; if (!v) bad++ })
  if (bad) { toast(`还有 ${bad} 项必填未填写`); return }
  const id = 9000 + state.adminQ.length + 1
  state.adminQ.unshift({ id, s: f.s.value, d: f.d.value, k: f.k.value, stem: f.stem.value, opts: LETTERS.map(L => f['o' + L].value), a: LETTERS.indexOf(f.a.value), why: f.why.value, srcType: f.srcType.value, srcName: f.srcName.value, srcLoc: f.srcLoc.value, license: f.license.value, status: '待审核', when: '刚刚' })
  state.adminQId = id
  state.adminTab = '待审核列表'
  toast('已保存并送审')
  render()
}
ACTIONS['mock-import'] = () => openModal(`<h2>导入预览</h2><p class="muted">示例文件 question-import-example.json：共 3 题，2 题校验通过，1 题缺少使用权限说明。</p>
  <table class="t"><thead><tr><th>#</th><th>题干</th><th>校验</th></tr></thead><tbody>
  <tr><td>1</td><td>页面置换算法 LRU 的缺页次数…</td><td><span class="badge green">通过</span></td></tr>
  <tr><td>2</td><td>二叉排序树删除结点后…</td><td><span class="badge green">通过</span></td></tr>
  <tr><td>3</td><td>以太网最短帧长计算…</td><td><span class="badge red">缺少使用权限说明</span></td></tr></tbody></table>
  <div class="modal-foot"><button class="key sm" data-act="close-modal">取消</button><button class="key ink sm" data-act="import-ok">导入 2 题并送审</button></div>`, true)
ACTIONS['import-ok'] = () => { closeModal(); toast('已导入 2 题，进入待审核（原型未加入列表）') }

/* =====================================================================
 * 启动：支持 ?state= 直达某个画面（评审与截图用），?role=admin 切换管理员
 * 例：?state=session  ?state=judged  ?state=review  ?state=drawer  ?state=admin-questions&role=admin
 * ===================================================================== */
;(() => {
  const params = new URLSearchParams(location.search)
  const st = params.get('state')
  if (st && PUBLIC.includes(st)) location.replace('#' + st)
  if (st && !PUBLIC.includes(st)) {
    state.user = { name: '林同学', role: params.get('role') === 'admin' || st.startsWith('admin') ? 'ADMIN' : 'STUDENT' }
    let route = st
    if (['session', 'judged', 'done', 'review'].includes(st)) {
      ensureSession()
      route = 'session'
      if (st === 'judged') { state.session.items[3].draft = 0; judge(3) }
      if (st === 'done') { state.session.items.forEach((it, i) => { if (!it.judged) it.draft = qById(state.session.ids[i]).a === 0 ? 1 : 0 }); state.session.items.forEach((_, i) => judge(i)); finishSession() }
      if (st === 'review') state.session.mode = 'review'
    }
    if (st === 'drawer') { route = 'wrong'; state.assistantOpen = true }
    if (st === 'recommend-result') {
      route = 'recommend'
      const mock = state.recommend.mock
      const pool = SCHOOLS.filter(s => s.exam === '408 统考').map(s => ({ s, line: avgLine(s.id), gap: mock - avgLine(s.id) }))
      state.recommend.result = { cond: `专硕 · 不限地区 · 模考 ${mock}`, chong: pool.filter(x => x.gap < 0 && x.gap >= -15), wen: pool.filter(x => x.gap >= 0 && x.gap <= 20), bao: pool.filter(x => x.gap > 20), below: pool.filter(x => x.gap < -15).length }
    }
    if (st === 'school') route = 'school/s2'
    location.replace('#' + route)
  }
  lastRoute = location.hash
  render(false)
})()

</script>
</body>
</html>
