/* =====================================================================
 * 考研 Agent 全量原型 · 答题纸（方向 A）+ 妙控键帽（按键 C）
 * ===================================================================== */
:root {
  --paper: #f4f1ea; --paper-card: #fbf9f4; --paper-2: #ece7dc; --paper-3: #e3ddcf; --field: #fffdf8;
  --ink: #23211d; --ink-2: #5c574e; --ink-3: #6f695f; --rule: #d8d1c2;
  --pen: #2f4a7a; --pen-deep: #1e3152; --pen-tint: #e4e6e6;
  --red: #b23a2e; --red-text: #962a20; --red-tint: #f3e3df;
  --green: #2e6b4f; --green-tint: #e2ebe4; --ochre: #8a6a2c; --ochre-tint: #efe6d2;
  /* 四科图表色：低饱和，红色留给“判错” */
  --s-ds: #2f4a7a; --s-co: #9a7b3c; --s-os: #4a463f; --s-net: #2e6b4f;
  --serif: "Songti SC", "Noto Serif SC", "Source Han Serif SC", "STSong", serif;
  --sans: -apple-system, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  --travel: 2px;
  --side: 212px;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--pen); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.serif { font-family: var(--serif); }
.mono { font-family: var(--mono); }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.small { font-size: 12px; }
.row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.spacer { flex: 1; }
.only-narrow { display: none !important; }
@media (max-width: 960px) { .only-narrow { display: flex !important; } }
.stack { display: grid; gap: 16px; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
.hr { height: 1px; background: var(--rule); margin: 18px 0; border: 0; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

/* ---------------- 键帽按键 ---------------- */
.key {
  appearance: none; border: 0; cursor: pointer; position: relative; flex: none;
  height: 44px; padding: 0 18px; border-radius: 9px;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  font: 600 15px/1 var(--sans); letter-spacing: .02em; color: var(--ink); white-space: nowrap; text-decoration: none;
  background: linear-gradient(180deg, #fffdf8 0%, #f1ece1 100%);
  box-shadow: inset 0 1px 0 #fff, 0 0 0 1px #cfc6b3, 0 var(--travel) 0 1px #c6bca7, 0 calc(var(--travel) + 6px) 12px -6px rgba(35,33,29,.4);
  transition: transform .06s ease-out, box-shadow .06s ease-out;
}
.key:hover { background: linear-gradient(180deg, #fff 0%, #f5f1e8 100%); }
.key:active, .key.is-down { transform: translateY(var(--travel)); box-shadow: inset 0 1px 0 #fff, 0 0 0 1px #cfc6b3, 0 0 0 1px #c6bca7, 0 2px 4px -2px rgba(35,33,29,.35); }
.key:focus-visible { outline: 3px solid var(--pen); outline-offset: 4px; }
.key.sm { height: 36px; padding: 0 13px; font-size: 13.5px; border-radius: 8px; gap: 8px; }
.key.xs { height: 30px; padding: 0 10px; font-size: 12.5px; border-radius: 7px; gap: 6px; --travel: 1.5px; }
.key.block { width: 100%; justify-content: space-between; }
.key.center { justify-content: center; }
.key.ink { color: #fff; background: linear-gradient(180deg, #3a5788 0%, #2b4573 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 0 0 1px #233a62, 0 var(--travel) 0 1px var(--pen-deep), 0 calc(var(--travel) + 6px) 14px -6px rgba(30,49,82,.6); }
.key.ink:hover { background: linear-gradient(180deg, #3f5d90 0%, #2f4a7a 100%); }
.key.ink:active, .key.ink.is-down { box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 0 0 1px #233a62, 0 0 0 1px var(--pen-deep), 0 2px 4px -2px rgba(30,49,82,.5); }
.key.danger { color: var(--red-text); }
.key.on { color: var(--pen); background: linear-gradient(180deg, #eef0f2, #e2e5ea); transform: translateY(var(--travel)); box-shadow: inset 0 1px 2px rgba(30,49,82,.18), 0 0 0 1.5px var(--pen); }
.key:disabled, .key[aria-disabled="true"] { color: rgba(35,33,29,.4); background: #ece7dc; box-shadow: 0 0 0 1px #d8d1c2; transform: translateY(var(--travel)); cursor: not-allowed; }
.key.ink:disabled { color: rgba(255,255,255,.8); background: #8d9bb3; box-shadow: 0 0 0 1px #8193ae; }
.glyph { font: 500 11.5px var(--mono); padding: 3px 6px; border-radius: 5px; background: rgba(35,33,29,.07); color: var(--ink-2); }
.key.ink .glyph { background: rgba(255,255,255,.16); color: rgba(255,255,255,.92); }
.key.opt { width: 44px; padding: 0; font: 700 17px var(--mono); }
.dots { display: inline-flex; gap: 4px; }
.dots i { width: 5px; height: 5px; border-radius: 50%; background: currentColor; animation: dot 1s infinite; }
.dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
@keyframes dot { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
.link { appearance: none; border: 0; background: none; padding: 0; color: var(--pen); font-weight: 600; cursor: pointer; text-decoration: none; }
.link:hover { text-decoration: underline; text-underline-offset: 3px; }
.link:focus-visible { outline: 2px solid var(--pen); outline-offset: 3px; border-radius: 2px; }
.link.danger { color: var(--red-text); }

/* ---------------- 表单 ---------------- */
.input, .select, .textarea {
  width: 100%; height: 42px; padding: 0 12px; border: 0; border-radius: 8px; outline: none;
  background: var(--field); color: var(--ink); font-size: 15px;
  box-shadow: inset 0 1px 2px rgba(35,33,29,.07), inset 0 0 0 1px var(--rule);
}
.select { appearance: none; padding-right: 32px; background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%); background-position: calc(100% - 17px) 18px, calc(100% - 12px) 18px; background-size: 5px 5px; background-repeat: no-repeat; }
.textarea { height: auto; min-height: 96px; padding: 10px 12px; line-height: 1.7; resize: vertical; }
.input::placeholder, .textarea::placeholder { color: var(--ink-3); }
.input:focus, .select:focus, .textarea:focus { box-shadow: inset 0 0 0 1px var(--pen), 0 0 0 3px rgba(47,74,122,.16); }
.input.invalid, .textarea.invalid, .select.invalid { box-shadow: inset 0 0 0 1px var(--red); }
.form-item { display: grid; gap: 6px; }
.form-item > label, .form-item > .lab { font-size: 13px; color: var(--ink-2); }
.form-item .err { color: var(--red-text); font-size: 12.5px; min-height: 0; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 20px; }
.form-grid .full { grid-column: 1 / -1; }
.check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
.check input { width: 16px; height: 16px; accent-color: var(--pen); }
.switch { appearance: none; width: 40px; height: 24px; border-radius: 12px; background: var(--paper-3); box-shadow: inset 0 0 0 1px var(--rule); position: relative; cursor: pointer; flex: none; transition: background .15s; }
.switch::after { content: ""; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fffdf8; box-shadow: 0 1px 2px rgba(35,33,29,.3); transition: transform .18s cubic-bezier(.3,1.4,.5,1); }
.switch:checked { background: var(--pen); box-shadow: none; }
.switch:checked::after { transform: translateX(16px); }
.switch:focus-visible { outline: 2px solid var(--pen); outline-offset: 2px; }

/* ---------------- 选择片 ---------------- */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { appearance: none; border: 0; cursor: pointer; height: 32px; padding: 0 13px; border-radius: 7px; background: var(--paper-card); color: var(--ink-2); font-size: 13.5px; box-shadow: 0 0 0 1px var(--rule); white-space: nowrap; }
.chip:hover { color: var(--ink); box-shadow: 0 0 0 1px var(--ink-3); }
.chip[aria-pressed="true"] { background: var(--pen-tint); color: var(--pen); font-weight: 600; box-shadow: 0 0 0 1.5px var(--pen); }
.chip:focus-visible { outline: 2px solid var(--pen); outline-offset: 2px; }
.badge { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 4px; background: var(--paper-2); color: var(--ink-2); font-size: 12px; white-space: nowrap; }
.badge.pen { background: var(--pen-tint); color: var(--pen); }
.badge.red { background: var(--red-tint); color: var(--red-text); }
.badge.green { background: var(--green-tint); color: var(--green); }
.badge.ochre { background: var(--ochre-tint); color: #6e521d; }
.badge.line { background: transparent; box-shadow: inset 0 0 0 1px var(--rule); }

/* ---------------- 分段标签 ---------------- */
.tabs { display: inline-flex; gap: 2px; padding: 3px; border-radius: 9px; background: var(--paper-2); position: relative; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.tab { appearance: none; border: 0; background: none; cursor: pointer; height: 32px; padding: 0 14px; border-radius: 7px; color: var(--ink-2); font-size: 13.5px; white-space: nowrap; position: relative; z-index: 1; }
.tab[aria-selected="true"] { background: var(--paper-card); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(35,33,29,.12), 0 0 0 1px var(--rule); }
.tab:focus-visible { outline: 2px solid var(--pen); outline-offset: 1px; }

/* ---------------- 卡片、表格、空状态 ---------------- */
.card { background: var(--paper-card); border-radius: 10px; box-shadow: 0 0 0 1px var(--rule), 0 24px 48px -40px rgba(35,33,29,.5); }
.pad { padding: 22px 24px; }
.card-h { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.card-h h2, .card-h h3 { margin: 0; font-family: var(--serif); font-size: 17px; }
.card-h .note { color: var(--ink-3); font-size: 12px; }
.label { font-size: 12px; color: var(--ink-3); letter-spacing: .12em; margin-bottom: 10px; }
.table-wrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.t th { text-align: left; font-weight: 600; color: var(--ink-2); font-size: 12.5px; padding: 9px 12px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
table.t td { padding: 11px 12px; border-bottom: 1px solid var(--paper-2); vertical-align: top; }
table.t tr:last-child td { border-bottom: 0; }
table.t tbody tr:hover td { background: rgba(227,221,207,.28); }
table.t .num { font-family: var(--mono); text-align: right; white-space: nowrap; }
.empty { padding: 40px 20px; text-align: center; color: var(--ink-2); }
.empty .serif { display: block; font-size: 17px; color: var(--ink); margin-bottom: 4px; }
.notice { padding: 10px 14px; border-radius: 8px; background: var(--paper-2); color: var(--ink-2); font-size: 13px; line-height: 1.7; }
.notice.warn { background: var(--ochre-tint); color: #6e521d; }
.notice.err { background: var(--red-tint); color: var(--red-text); }
.notice.ok { background: var(--green-tint); color: var(--green); }
.skeleton { border-radius: 6px; background: linear-gradient(90deg, var(--paper-2) 25%, var(--paper-3) 50%, var(--paper-2) 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }

/* ---------------- 应用外壳 ---------------- */
.app { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; overflow-y: auto; border-right: 1px solid var(--rule); padding: 20px 14px 16px; display: flex; flex-direction: column; gap: 14px; }
.side-brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 8px; }
/* 项目原有 Logo（public/logo.png）原样嵌入，不改图形和配色 */
.mark { width: 34px; height: 34px; border-radius: 8px; display: block; flex: none; }
.mark.lg { width: 40px; height: 40px; border-radius: 9px; }
.side-brand b { font-family: var(--serif); font-size: 17px; display: block; line-height: 1.2; }
.side-brand small { color: var(--ink-3); font-size: 11.5px; }
.nav-group { display: grid; gap: 1px; }
.nav-group > span { font-size: 11.5px; color: var(--ink-3); letter-spacing: .14em; padding: 6px 10px 4px; }
.nav-item { appearance: none; border: 0; background: none; cursor: pointer; text-align: left; display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 7px; color: var(--ink-2); font-size: 14px; }
.nav-item:hover { background: var(--paper-2); color: var(--ink); }
.nav-item[aria-current="page"] { background: var(--paper-card); color: var(--ink); font-weight: 600; box-shadow: 0 0 0 1px var(--rule), 0 1px 0 #c6bca7; }
.nav-item:focus-visible { outline: 2px solid var(--pen); outline-offset: 1px; }
.nav-item i { width: 18px; font-style: normal; font-family: var(--serif); font-size: 13px; color: var(--ink-3); text-align: center; }
.nav-item[aria-current="page"] i { color: var(--pen); }
.nav-item .count { margin-left: auto; font: 11px var(--mono); color: var(--ink-3); }
.side-foot { margin-top: auto; padding: 12px 8px 0; border-top: 1px solid var(--rule); display: grid; gap: 10px; }
.me { display: flex; align-items: center; gap: 10px; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--paper-3); display: grid; place-items: center; font-family: var(--serif); font-weight: 700; color: var(--ink); flex: none; }
.avatar.lg { width: 72px; height: 72px; font-size: 28px; }
.me b { display: block; font-size: 13.5px; line-height: 1.2; }
.me small { color: var(--ink-3); font-size: 11.5px; }
.main { min-width: 0; }
.topbar { display: none; }
.page { max-width: 1180px; margin: 0 auto; padding: 28px 36px 64px; }
.page.wide { max-width: 1320px; }
.page-head { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
.page-head h1 { font-family: var(--serif); font-size: 26px; line-height: 1.25; margin: 0; }
.page-head p { margin: 4px 0 0; color: var(--ink-2); }
.page-head .tools { margin-left: auto; display: flex; gap: 10px; flex-wrap: wrap; }
.crumb { font-size: 13px; color: var(--ink-3); margin-bottom: 8px; }
.tabbar { display: none; }
.proto-flag { position: fixed; right: 12px; bottom: 12px; z-index: 40; font-size: 12px; color: var(--ink-2); background: rgba(251,249,244,.95); padding: 6px 10px; border-radius: 6px; box-shadow: 0 0 0 1px var(--rule); pointer-events: none; }
.toast { position: fixed; left: 50%; top: 20px; z-index: 90; transform: translate(-50%, -8px); opacity: 0; pointer-events: none; background: var(--ink); color: #f4f1ea; padding: 9px 16px; border-radius: 8px; font-size: 13px; transition: opacity .2s ease, transform .2s ease; max-width: calc(100vw - 32px); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------------- 弹窗与抽屉 ---------------- */
.overlay { position: fixed; inset: 0; z-index: 70; background: rgba(35,33,29,.32); display: grid; place-items: center; padding: 20px; animation: fade .15s ease; }
@keyframes fade { from { opacity: 0; } }
.modal { width: min(560px, 100%); max-height: calc(100vh - 40px); overflow-y: auto; background: var(--paper-card); border-radius: 12px; box-shadow: 0 30px 80px -20px rgba(35,33,29,.5); padding: 24px 26px; animation: rise .22s cubic-bezier(.2,.8,.2,1); }
.modal.wide { width: min(820px, 100%); }
.modal h2 { font-family: var(--serif); font-size: 20px; margin: 0 0 6px; }
.modal-foot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }
.drawer-wrap { position: fixed; inset: 0; z-index: 60; pointer-events: none; }
.drawer { position: absolute; right: 16px; top: 16px; bottom: 16px; width: 400px; pointer-events: auto; background: var(--paper-card); border-radius: 12px; box-shadow: 0 0 0 1px var(--rule), 0 30px 60px -20px rgba(35,33,29,.45); display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; animation: slide .25s cubic-bezier(.2,.8,.2,1); }
@keyframes slide { from { transform: translateX(24px); opacity: 0; } }
.drawer-h { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--rule); }
.drawer-h b { font-family: var(--serif); font-size: 16px; }
.launcher { position: fixed; right: 24px; bottom: 56px; z-index: 30; }

/* ---------------- 指标与图表 ---------------- */
.big { font-family: var(--serif); font-size: 34px; font-weight: 700; line-height: 1; letter-spacing: -.01em; }
.big small { font-size: 14px; font-weight: 400; color: var(--ink-2); margin-left: 2px; }
.kpis { display: flex; gap: 32px; flex-wrap: wrap; }
.kpi .cap { color: var(--ink-3); font-size: 12px; margin-top: 6px; }
.subj { display: grid; grid-template-columns: 76px 1fr 32px; gap: 10px; align-items: center; margin-bottom: 11px; color: var(--ink-2); font-size: 13px; }
.subj.on { color: var(--ink); font-weight: 600; }
.bar { height: 5px; border-radius: 3px; background: var(--paper-3); overflow: hidden; }
.bar span { display: block; height: 100%; border-radius: 3px; background: var(--ink-2); transition: width .6s cubic-bezier(.2,.7,.2,1); }
.subj.on .bar span { background: var(--pen); }
.subj b { font: 500 12px var(--mono); text-align: right; }
.bump { animation: bump .6s ease; }
@keyframes bump { 30% { color: var(--pen); transform: translateY(-2px); } }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink-3); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { font-family: var(--sans); font-size: 11px; fill: var(--ink-3); }
.chart .axis { stroke: var(--rule); }
.heat { display: grid; gap: 3px; font-size: 11px; }
.heat .hc { height: 26px; border-radius: 3px; display: grid; place-items: center; font-family: var(--mono); font-size: 12px; }
.heat .hl { color: var(--ink-2); font-size: 12px; display: flex; align-items: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 6px; }
.rank li { display: grid; grid-template-columns: 24px 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--paper-2); }
.rank ol, ol.rank { list-style: none; margin: 0; padding: 0; }
.rank .n { font: 600 12px var(--mono); color: var(--ink-3); }
.mini-bar { height: 6px; border-radius: 3px; background: var(--paper-3); margin-top: 5px; overflow: hidden; }
.mini-bar span { display: block; height: 100%; background: var(--pen); }

/* ---------------- 登录 / 注册 ---------------- */
.auth { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr) 460px; position: relative; overflow: hidden; isolation: isolate; }
/* 动态像素方格背景：移植自项目 PixelField，配色与现登录页一致 */
.pixel-field { position: absolute; inset: 0; z-index: -1; width: 100%; height: 100%; display: block; pointer-events: none; }
.auth-stage { padding: 56px 64px; display: grid; grid-template-columns: minmax(0, 420px) auto; justify-content: space-between; align-items: center; gap: 40px; }
.auth-brand { display: flex; align-items: center; gap: 10px; font-weight: 600; color: var(--ink-2); margin-bottom: 40px; }
.display { font-family: var(--serif); font-size: 60px; line-height: 1.1; font-weight: 700; margin: 0 0 16px; position: relative; display: inline-block; }
.display::before, .display::after { content: attr(data-text); position: absolute; inset: 0; opacity: 0; pointer-events: none; }
.display::before { color: var(--pen); } .display::after { color: var(--red); }
@media (hover: hover) { .display:hover::before { animation: ga .32s steps(2) both; } .display:hover::after { animation: gb .32s steps(2) both; } }
@keyframes ga { 0% { opacity: .9; clip-path: inset(10% 0 55% 0); transform: translate(-3px,-1px); } 50% { opacity: .9; clip-path: inset(60% 0 8% 0); transform: translate(3px,1px); } 100% { opacity: 0; } }
@keyframes gb { 0% { opacity: .8; clip-path: inset(55% 0 15% 0); transform: translate(3px,1px); } 50% { opacity: .8; clip-path: inset(15% 0 60% 0); transform: translate(-3px,-1px); } 100% { opacity: 0; } }
.typer { font: 600 17px var(--mono); color: var(--pen); margin: 0 0 22px; min-height: 27px; }
.caret { display: inline-block; width: 2px; height: 1.1em; margin-left: 3px; vertical-align: -3px; background: var(--pen); animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.slogan { font-family: var(--serif); font-size: 21px; font-weight: 700; letter-spacing: .2em; margin: 0 0 10px; }
.auth-desc { color: var(--ink-2); margin: 0 0 26px; }
.feat { list-style: none; margin: 0; padding: 20px 0 0; border-top: 1px solid var(--rule); display: grid; gap: 8px; }
.feat span { font: 12px var(--mono); color: var(--ink-3); margin-right: 14px; }
.sheet { width: 340px; padding: 22px 22px 18px; background: var(--paper-card); border-radius: 6px; box-shadow: 0 0 0 1px var(--rule), 0 24px 48px -30px rgba(35,33,29,.45); transform: rotate(-1.5deg); animation: bob 6s ease-in-out infinite; }
@keyframes bob { 50% { translate: 0 -10px; } }
.sheet-head { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 12px; margin-bottom: 14px; border-bottom: 1px solid var(--rule); }
.sheet-head b { font-family: var(--serif); font-size: 18px; letter-spacing: .1em; }
.sheet-head span { font-size: 12px; color: var(--ink-3); }
.sheet-row { display: grid; grid-template-columns: 64px 1fr; gap: 8px; align-items: center; margin-bottom: 10px; font-size: 12px; color: var(--ink-2); }
.mini { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
.mini i { height: 22px; border-radius: 3px; border: 1px solid var(--rule); position: relative; }
.mini i.d, .mini i.w { background: var(--paper-3); border-color: var(--paper-3); }
.mini i.w::after { content: ""; position: absolute; left: 3px; right: 3px; top: 50%; height: 2px; background: var(--red); transform: rotate(-28deg); border-radius: 2px; }
.mini i.f { border-style: dashed; border-color: var(--pen); }
.mini i.n { border: 2px solid var(--ink); }
.auth-side { display: grid; place-items: center; padding: 40px; }
.auth-card { width: 100%; max-width: 380px; padding: 34px 30px 26px; }
.auth-card h2 { font-family: var(--serif); font-size: 28px; margin: 0 0 4px; }
.auth-card > p { color: var(--ink-2); margin: 0 0 22px; }
.auth-card .form-item { margin-bottom: 14px; }
.auth-card .input { height: 46px; font-size: 16px; }
.auth-foot { text-align: center; margin-top: 18px; color: var(--ink-2); font-size: 13px; }

/* ---------------- 首页 ---------------- */
.greet { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
.greet h1 { font-family: var(--serif); font-size: 30px; margin: 0; }
.diag { display: grid; grid-template-columns: auto 1fr auto; gap: 20px; align-items: center; padding: 20px 24px; margin-bottom: 22px; }
/* 诊断图标：去掉底块和边框，只留一个宋体“诊”字，与页面标题同一字族 */
.diag-mark { width: 48px; display: grid; place-items: center; font: 700 38px/1 var(--serif); color: var(--pen); }
.home-grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 22px; align-items: start; }
.quick { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.quick button { appearance: none; border: 0; cursor: pointer; text-align: left; padding: 16px; border-radius: 9px; background: var(--paper-card); box-shadow: 0 0 0 1px var(--rule), 0 var(--travel) 0 1px #d8d1c2; display: grid; gap: 4px; transition: transform .06s, box-shadow .06s; }
.quick button:hover { box-shadow: 0 0 0 1px var(--ink-3), 0 var(--travel) 0 1px #c6bca7; }
.quick button:active { transform: translateY(var(--travel)); box-shadow: 0 0 0 1px var(--ink-3); }
.quick button:focus-visible { outline: 3px solid var(--pen); outline-offset: 3px; }
.quick b { font-family: var(--serif); font-size: 16px; }
.quick span { color: var(--ink-3); font-size: 12.5px; }

/* ---------------- 刷题设置 ---------------- */
.cfg-row { display: grid; grid-template-columns: 56px 1fr; gap: 16px; align-items: center; padding: 13px 0; border-bottom: 1px solid var(--paper-2); }
.cfg-row > span { color: var(--ink-2); font-size: 13px; }
.cfg-foot { display: flex; align-items: center; gap: 14px; margin-top: 16px; padding-top: 18px; border-top: 1px solid var(--rule); flex-wrap: wrap; }

/* ---------------- 刷题（专注模式） ---------------- */
.focus-top { position: sticky; top: 0; z-index: 10; height: 56px; display: flex; align-items: center; gap: 18px; padding: 0 28px; background: rgba(244,241,234,.95); border-bottom: 1px solid var(--rule); }
.focus-top .title { font-family: var(--serif); font-size: 16px; font-weight: 700; }
.progress { flex: 1; max-width: 360px; height: 4px; border-radius: 2px; background: var(--paper-3); overflow: hidden; }
.progress span { display: block; height: 100%; background: var(--pen); transition: width .4s; }
.desk { display: grid; grid-template-columns: 210px minmax(0, 1fr) 290px; gap: 44px; max-width: 1400px; margin: 0 auto; padding: 28px 32px 48px; }
.answer-card { display: grid; grid-template-columns: repeat(5, 34px); gap: 7px; }
.cell { appearance: none; cursor: pointer; position: relative; height: 34px; border-radius: 4px; display: grid; place-items: center; font: 12px var(--mono); color: var(--ink-2); background: transparent; border: 1px solid var(--rule); }
.cell:hover { border-color: var(--ink-3); }
.cell:focus-visible { outline: 2px solid var(--pen); outline-offset: 2px; }
.cell.ok, .cell.bad { background: var(--paper-3); border-color: var(--paper-3); color: var(--ink); }
.cell.bad { color: var(--red-text); }
.cell.bad::after { content: ""; position: absolute; left: 6px; right: 6px; top: 50%; height: 2px; margin-top: -1px; border-radius: 2px; background: var(--red); transform: rotate(-26deg); animation: stroke .35s ease-out; }
@keyframes stroke { from { transform: rotate(-26deg) scaleX(0); } }
.cell.draft { border-style: dashed; border-color: var(--pen); color: var(--pen); }
.cell.now { border: 2px solid var(--ink); color: var(--ink); font-weight: 700; }
.cell.assist::before { content: ""; position: absolute; right: 3px; top: 3px; width: 5px; height: 5px; border-radius: 50%; background: var(--pen); }
.cell.skip { color: var(--ink-3); background: repeating-linear-gradient(135deg, transparent 0 4px, rgba(35,33,29,.06) 4px 6px); }
.sheet-paper { max-width: 700px; width: 100%; justify-self: center; }
.q-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--ink-3); font-size: 13px; margin-bottom: 14px; align-items: baseline; }
.q-meta strong { color: var(--ink); font-family: var(--serif); font-size: 16px; }
.stem { font-family: var(--serif); font-size: 18px; line-height: 1.85; margin: 0 0 18px; }
pre.code { margin: 0 0 20px; padding: 14px 18px; background: var(--paper-2); border-radius: 4px; font: 14px/1.75 var(--mono); overflow-x: auto; white-space: pre; }
.opts { display: grid; gap: 8px; }
.opt-row { appearance: none; border: 0; background: transparent; cursor: pointer; text-align: left; display: flex; align-items: center; gap: 16px; padding: 7px 10px 7px 6px; border-radius: 8px; font: 17px/1.5 var(--serif); color: var(--ink); width: 100%; }
.opt-row:hover { background: rgba(227,221,207,.45); }
.opt-row:focus-visible { outline: 2px solid var(--pen); outline-offset: 2px; }
.opt-row .key { pointer-events: none; }
.opt-row[aria-checked="true"] { color: var(--pen); }
.opt-row[aria-checked="true"] .key { color: #fff; background: linear-gradient(180deg, #3a5788, #2b4573); box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 0 0 1px #233a62, 0 0 0 1px var(--pen-deep), 0 2px 4px -2px rgba(30,49,82,.5); transform: translateY(var(--travel)); }
.opt-row.right { color: var(--green); }
.opt-row.wrong { color: var(--red-text); }
.opt-row.right .key { color: #fff; background: var(--green); box-shadow: 0 0 0 1px #24553e; transform: translateY(var(--travel)); }
.opt-row.wrong .key { color: #fff; background: var(--red); box-shadow: 0 0 0 1px #8f2e25; transform: translateY(var(--travel)); }
.opt-row.locked { cursor: default; }
.opt-row.locked:hover { background: transparent; }
.opt-tag { margin-left: auto; font: 12px var(--sans); color: var(--ink-3); white-space: nowrap; }
.opt-row.right .opt-tag { color: var(--green); font-weight: 600; }
.opt-row.wrong .opt-tag { color: var(--red-text); font-weight: 600; }
.feedback { margin-top: 16px; padding: 14px 16px; border-radius: 8px; background: var(--paper-card); box-shadow: 0 0 0 1px var(--rule); font-size: 14px; line-height: 1.8; }
.feedback b.ok { color: var(--green); } .feedback b.bad { color: var(--red-text); }
.act { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--rule); }
.act .status { color: var(--ink-2); font-size: 13px; }
.act .status b { color: var(--pen); }
.act .pager { margin-left: auto; display: flex; gap: 10px; }
.hint-line { margin-top: 12px; color: var(--ink-3); font-size: 12px; }
kbd { font: 11px var(--mono); padding: 1px 5px; border-radius: 4px; background: var(--paper-2); color: var(--ink-2); }
.margin { border-left: 1px solid var(--rule); padding-left: 24px; display: grid; gap: 28px; align-content: start; }
.ask-box { background: var(--paper-2); border-radius: 8px; padding: 12px 14px; color: var(--ink-2); font-size: 13px; line-height: 1.75; }
.ask-box.answered { background: var(--paper-card); box-shadow: 0 0 0 1px var(--rule); color: var(--ink); }
.lined { width: 100%; min-height: 120px; resize: vertical; border: 0; outline: none; background-color: transparent; padding: 0; font: 16px/1.9 var(--serif); color: var(--ink); background-image: linear-gradient(transparent calc(1.9em - 1px), var(--rule) calc(1.9em - 1px)); background-size: 100% 1.9em; }
.lined:focus { background-color: rgba(255,253,248,.6); }
.tutor { margin-top: 18px; padding: 16px 18px; }
.tutor .q { color: var(--ink-2); font-size: 13px; margin: 10px 0 4px; }
.tutor .a { font-size: 14px; line-height: 1.8; }
.review-sum { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-bottom: 18px; }
.review-sum div { padding: 14px 16px; }
.review-item { padding: 18px 22px; }
.review-item .stem { font-size: 16px; margin-bottom: 12px; }
.ropt { display: flex; gap: 12px; align-items: baseline; padding: 4px 0; font-family: var(--serif); font-size: 15px; }
.ropt b { font-family: var(--mono); width: 18px; color: var(--ink-3); }
.ropt.right { color: var(--green); } .ropt.right b { color: var(--green); }
.ropt.wrong { color: var(--red-text); } .ropt.wrong b { color: var(--red-text); }
.ropt em { font-style: normal; font-size: 12px; font-family: var(--sans); margin-left: 8px; }

/* ---------------- 错题 / 收藏 ---------------- */
.q-item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px 16px; align-items: start; padding: 18px 22px; }
.q-item .stem { font-size: 16px; margin: 0 0 6px; }
.q-item .meta { color: var(--ink-3); font-size: 12px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.q-item .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.q-item .detail { grid-column: 2 / -1; margin-top: 6px; padding-top: 12px; border-top: 1px dashed var(--rule); font-size: 14px; line-height: 1.8; }
.sel-bar { position: sticky; top: 12px; z-index: 5; display: flex; align-items: center; gap: 12px; padding: 10px 14px; margin-bottom: 14px; border-radius: 10px; background: var(--ink); color: #f4f1ea; flex-wrap: wrap; }
.sel-bar .key { --travel: 1.5px; }

/* ---------------- 学情 ---------------- */
.stats-layout { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 20px; }
.span-4 { grid-column: span 4; } .span-5 { grid-column: span 5; } .span-6 { grid-column: span 6; } .span-7 { grid-column: span 7; } .span-8 { grid-column: span 8; } .span-12 { grid-column: span 12; }
.range { display: grid; gap: 6px; }
.range-bar { position: relative; height: 32px; border-radius: 6px; background: var(--paper-2); }
.range-bar .band { position: absolute; top: 6px; bottom: 6px; border-radius: 4px; background: rgba(47,74,122,.22); box-shadow: inset 0 0 0 1px rgba(47,74,122,.4); }
.range-bar .pt { position: absolute; top: 2px; bottom: 2px; width: 3px; margin-left: -1.5px; border-radius: 2px; background: var(--pen); }
.range-scale { display: flex; justify-content: space-between; font: 11px var(--mono); color: var(--ink-3); }
.subj-cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.subj-card { padding: 14px 16px; border-radius: 8px; background: var(--paper); box-shadow: inset 0 0 0 1px var(--rule); }
.subj-card b { display: block; font-family: var(--serif); font-size: 15px; }
.subj-card .big { font-size: 26px; margin: 8px 0 4px; }

/* ---------------- 真题分析 ---------------- */
.exam-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 20px; }
.exam-kpis .card { padding: 16px 18px; }

/* ---------------- 院校 ---------------- */
.filters { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)) auto; gap: 12px; align-items: end; margin-bottom: 18px; }
.school-list { display: grid; gap: 12px; }
.school { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 20px; padding: 18px 22px; align-items: center; }
.school h3 { font-family: var(--serif); font-size: 18px; margin: 0; }
.school .meta { display: flex; gap: 8px; flex-wrap: wrap; }
.school .majors { grid-column: 1 / -1; color: var(--ink-2); font-size: 13px; }
.pending { color: var(--ink-3); }
.verdict { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.verdict .col { padding: 16px 18px; border-radius: 10px; background: var(--paper-card); box-shadow: 0 0 0 1px var(--rule); }
.verdict h3 { font-family: var(--serif); margin: 0 0 4px; font-size: 18px; display: flex; align-items: baseline; gap: 8px; }
.verdict .tier-chong h3 { color: var(--red-text); } .verdict .tier-wen h3 { color: var(--pen); } .verdict .tier-bao h3 { color: var(--green); }
.cand { padding: 10px 0; border-top: 1px solid var(--paper-2); display: grid; gap: 2px; }
.cand b { font-family: var(--serif); font-size: 15px; }
.gap-pos { color: var(--green); font-family: var(--mono); }
.gap-neg { color: var(--red-text); font-family: var(--mono); }

/* ---------------- 助手 ---------------- */
.chat-app { display: grid; grid-template-columns: 260px minmax(0, 1fr); height: 100vh; }
.conv-side { border-right: 1px solid var(--rule); padding: 18px 12px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
.conv { appearance: none; border: 0; background: none; text-align: left; cursor: pointer; padding: 10px 12px; border-radius: 8px; display: grid; gap: 2px; color: var(--ink-2); }
.conv:hover { background: var(--paper-2); }
.conv[aria-current="true"] { background: var(--paper-card); color: var(--ink); box-shadow: 0 0 0 1px var(--rule); }
.conv b { font-size: 13.5px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.conv small { color: var(--ink-3); font-size: 11.5px; }
.conv:focus-visible { outline: 2px solid var(--pen); }
.chat-main { display: grid; grid-template-rows: auto 1fr auto; min-height: 0; }
.chat-head { display: flex; align-items: center; gap: 12px; padding: 14px 28px; border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
.chat-head b { font-family: var(--serif); font-size: 17px; }
.msgs { overflow-y: auto; padding: 24px 28px; display: grid; gap: 18px; align-content: start; }
.msgs .inner { max-width: 820px; width: 100%; margin: 0 auto; display: grid; gap: 18px; }
.msg { max-width: 86%; padding: 12px 16px; border-radius: 10px; line-height: 1.8; font-size: 14.5px; }
.msg.me { justify-self: end; background: var(--pen); color: #fff; border-bottom-right-radius: 3px; white-space: pre-wrap; }
.msg.bot { background: var(--paper-card); box-shadow: 0 0 0 1px var(--rule); border-bottom-left-radius: 3px; }
.msg.bot h4 { font-family: var(--serif); margin: 10px 0 4px; font-size: 15px; }
.msg.bot ul, .msg.bot ol { margin: 4px 0; padding-left: 20px; }
.msg .src { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--rule); font-size: 12px; color: var(--ink-3); }
.msg .msg-acts { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.composer { padding: 12px 28px 18px; border-top: 1px solid var(--rule); background: var(--paper); }
.composer .inner { max-width: 820px; margin: 0 auto; display: grid; gap: 10px; }
.composer-row { display: flex; gap: 10px; align-items: flex-end; }
.composer textarea { min-height: 44px; height: 44px; max-height: 160px; resize: none; }
.welcome { text-align: center; padding: 40px 10px; }
.welcome h2 { font-family: var(--serif); font-size: 26px; margin: 0 0 6px; }
.attach { display: flex; gap: 6px; flex-wrap: wrap; }
.plan-day { display: grid; grid-template-columns: 60px 1fr; gap: 10px; padding: 6px 0; border-bottom: 1px dashed var(--rule); }

/* ---------------- 资料 / 笔记 ---------------- */
.split { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 24px; align-items: start; }
.list-btn { appearance: none; border: 0; text-align: left; cursor: pointer; padding: 12px 14px; border-radius: 8px; background: transparent; color: var(--ink-2); display: grid; gap: 3px; width: 100%; }
.list-btn:hover { background: var(--paper-2); }
.list-btn[aria-current="true"] { background: var(--paper-card); color: var(--ink); box-shadow: 0 0 0 1px var(--rule); }
.list-btn b { font-family: var(--serif); font-size: 15px; color: var(--ink); font-weight: 700; }
.list-btn small { color: var(--ink-3); }
.list-btn:focus-visible { outline: 2px solid var(--pen); }
.reader { padding: 28px 34px; }
.reader h2 { font-family: var(--serif); font-size: 24px; margin: 0 0 6px; }
.reader .body { font-family: var(--serif); font-size: 16px; line-height: 1.95; }
.reader .body h3 { font-size: 17px; margin: 22px 0 6px; }
.editor-title { width: 100%; border: 0; outline: none; background: transparent; font: 700 22px var(--serif); color: var(--ink); padding: 0; }
.diff-del { background: var(--red-tint); color: var(--red-text); text-decoration: line-through; }
.diff-add { background: var(--green-tint); color: var(--green); }
.md h3 { font-family: var(--serif); font-size: 17px; margin: 14px 0 4px; }
.md p { margin: 0 0 10px; }
.md ul { margin: 0 0 10px; padding-left: 20px; }
.md code { font: 13px var(--mono); background: var(--paper-2); padding: 1px 5px; border-radius: 4px; }

/* ---------------- 管理 ---------------- */
.admin-detail { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 22px; align-items: start; }
.src-grid { display: grid; grid-template-columns: 96px 1fr; gap: 6px 12px; font-size: 13px; }
.src-grid dt { color: var(--ink-3); }
.src-grid dd { margin: 0; }
.dropzone { border: 1.5px dashed var(--rule); border-radius: 10px; padding: 28px; text-align: center; color: var(--ink-2); background: var(--paper); }

/* ---------------- 更多（手机） ---------------- */
.more-group { margin-bottom: 18px; }
.more-group .card { display: grid; }
.more-item { appearance: none; border: 0; background: none; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--paper-2); font-size: 15px; color: var(--ink); }
.more-item:last-child { border-bottom: 0; }
.more-item i { font-style: normal; font-family: var(--serif); color: var(--ink-3); width: 20px; text-align: center; }
.more-item span { margin-left: auto; color: var(--ink-3); }

/* =====================================================================
 * 窄屏
 * ===================================================================== */
@media (max-width: 1180px) {
  .desk { grid-template-columns: 190px minmax(0, 1fr); }
  .desk .margin { grid-column: 1 / -1; border-left: 0; padding-left: 0; border-top: 1px solid var(--rule); padding-top: 22px; grid-template-columns: 1fr 1fr; }
  .home-grid { grid-template-columns: 1fr; }
  .admin-detail { grid-template-columns: 1fr; }
}
@media (max-width: 960px) {
  .auth { grid-template-columns: 1fr; align-content: start; }
  .auth-stage { display: block; padding: 28px 20px 8px; }
  .auth-stage .sheet { display: none; }
  .auth-brand { margin-bottom: 18px; }
  .display { font-size: 40px; margin-bottom: 8px; }
  .typer { font-size: 15px; margin-bottom: 12px; }
  .slogan { font-size: 17px; letter-spacing: .14em; margin: 0; }
  .auth-desc, .feat { display: none; }
  .auth-side { padding: 16px 16px 40px; }
  .auth-card { max-width: none; padding: 26px 20px 22px; }
  .stats-layout > * { grid-column: span 12; }
  .grid-3 { grid-template-columns: 1fr 1fr; }
  .exam-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .split { grid-template-columns: 1fr; }
  .verdict { grid-template-columns: 1fr; }
  .filters { grid-template-columns: 1fr 1fr; }
  .chat-app { grid-template-columns: 1fr; }
  .conv-side { display: none; }
}
@media (max-width: 760px) {
  body { font-size: 15px; }
  .input, .select, .textarea { font-size: 16px; }
  .app { display: block; padding-bottom: 72px; }
  .side { display: none; }
  .topbar { display: flex; position: sticky; top: 0; z-index: 20; height: 52px; align-items: center; gap: 12px; padding: 0 16px; background: rgba(244,241,234,.96); border-bottom: 1px solid var(--rule); }
  .topbar b { font-family: var(--serif); font-size: 17px; }
  .tabbar { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; height: 60px; background: rgba(244,241,234,.97); border-top: 1px solid var(--rule); padding-bottom: env(safe-area-inset-bottom); }
  .tabbar button { appearance: none; border: 0; background: none; color: var(--ink-3); font-size: 11.5px; display: grid; place-items: center; gap: 1px; padding: 6px 0; cursor: pointer; }
  .tabbar button i { font: 700 16px var(--serif); font-style: normal; }
  .tabbar button[aria-current="page"] { color: var(--pen); font-weight: 700; }
  .page { padding: 18px 16px 32px; }
  .page-head h1 { font-size: 22px; }
  .page-head .tools { margin-left: 0; width: 100%; }
  .grid-2, .grid-3, .form-grid, .quick, .subj-cards, .review-sum { grid-template-columns: 1fr 1fr; }
  .form-grid { grid-template-columns: 1fr; }
  .filters { grid-template-columns: 1fr; }
  .diag { grid-template-columns: auto 1fr; }
  .diag > .row { grid-column: 1 / -1; }
  .desk { display: block; padding: 0 16px 24px; }
  .card-side { position: sticky; top: 52px; z-index: 5; background: var(--paper); margin: 0 -16px; padding: 10px 16px; border-bottom: 1px solid var(--rule); }
  .card-side .label, .card-side .legend, .card-side .side-stats { display: none; }
  .answer-card { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .cell { flex: none; width: 40px; height: 40px; }
  .sheet-paper { padding-top: 16px; }
  .stem { font-size: 17px; }
  .opt-row { font-size: 16px; padding: 6px 4px; }
  .act { position: sticky; bottom: 0; z-index: 4; background: var(--paper); margin: 20px -16px 0; padding: 12px 16px; }
  .act .status { order: 3; width: 100%; font-size: 12px; }
  .act > .key.ink { flex: 1; justify-content: space-between; }
  .act .pager { margin-left: 0; }
  .hint-line.kbd-only { display: none; }
  .desk .margin { display: grid; grid-template-columns: 1fr; margin-top: 22px; }
  .focus-top { padding: 0 12px; gap: 10px; height: 52px; }
  .focus-top .title { display: none; }
  .key.sm { height: 40px; }
  .key.xs { height: 34px; }
  .q-item { grid-template-columns: auto minmax(0, 1fr); }
  .q-item .acts { grid-column: 1 / -1; justify-content: flex-start; }
  .q-item .detail { grid-column: 1 / -1; }
  .school { grid-template-columns: 1fr; }
  .msgs, .composer, .chat-head { padding-left: 16px; padding-right: 16px; }
  .chat-app { height: calc(100vh - 52px - 60px); }
  .msg { max-width: 94%; }
  .launcher { bottom: 72px; right: 16px; }
  .drawer { left: 8px; right: 8px; top: 8px; bottom: 8px; width: auto; }
  .proto-flag { display: none; }
  .reader { padding: 20px; }
  .modal { padding: 20px; }
  .kpis { gap: 22px; }
  .exam-kpis .big { font-size: 26px; }
  .sel-bar { top: 60px; }
  .table-wrap { margin: 0 -8px; }
}

</style>

const $ = (s, el = document) => el.querySelector(s)
const $$ = (s, el = document) => [...el.querySelectorAll(s)]
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const pct = (a, b) => b ? Math.round(a / b * 100) : 0
const todayRate = () => pct(state.today.correct, state.today.judged)
const pad2 = n => String(n).padStart(2, '0')
let toastTimer = 0
function toast(text) {
  const t = $('#toast')
  t.textContent = text
  t.classList.add('show')
  clearTimeout(toastTimer)
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000)
}
// 极简 Markdown：### 标题、- 列表、`代码`、段落
function md(text) {
  const inline = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>')
  const out = []
  let list = false
  for (const line of String(text).split('\n')) {
    if (line.startsWith('- ')) { if (!list) { out.push('<ul>'); list = true } out.push(`<li>${inline(line.slice(2))}</li>`); continue }
    if (list) { out.push('</ul>'); list = false }
    if (line.startsWith('### ')) out.push(`<h3>${inline(line.slice(4))}</h3>`)
    else if (line.trim()) out.push(`<p>${inline(line)}</p>`)
  }
  if (list) out.push('</ul>')
  return out.join('')
}

/* ---------------- 图表（SVG，无第三方库） ---------------- */
function lineChart(series, labels, { h = 200, min = 0, max = 50, unit = '' } = {}) {
  const w = 560, l = 32, r = 12, t = 10, b = 26
  const x = i => l + i * (w - l - r) / (labels.length - 1)
  const y = v => t + (1 - (v - min) / (max - min)) * (h - t - b)
  const ticks = [min, (min + max) / 2, max]
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="折线图">
    ${ticks.map(v => `<line class="axis" x1="${l}" x2="${w - r}" y1="${y(v)}" y2="${y(v)}" stroke-dasharray="2 4"/><text x="${l - 6}" y="${y(v) + 4}" text-anchor="end">${v}${unit}</text>`).join('')}
    ${labels.map((lb, i) => `<text x="${x(i)}" y="${h - 6}" text-anchor="middle">${lb}</text>`).join('')}
    ${Object.entries(series).map(([name, vals]) => `<polyline fill="none" stroke="${SUBJ_COLOR[name] || 'var(--pen)'}" stroke-width="2" stroke-linejoin="round" points="${vals.map((v, i) => `${x(i)},${y(v)}`).join(' ')}"/>
      ${vals.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="var(--paper-card)" stroke="${SUBJ_COLOR[name] || 'var(--pen)'}" stroke-width="1.5"><title>${name} ${labels[i]}：${v}${unit}</title></circle>`).join('')}`).join('')}
  </svg>`
}
function donut(parts, label) {
  let acc = 0
  const stops = Object.entries(parts).map(([k, v]) => { const s = `${SUBJ_COLOR[k]} ${acc}% ${acc + v}%`; acc += v; return s }).join(', ')
  return `<div class="row" style="gap:24px;align-items:center">
    <div style="width:132px;height:132px;border-radius:50%;background:conic-gradient(${stops});display:grid;place-items:center;flex:none" role="img" aria-label="${label}">
      <div style="width:84px;height:84px;border-radius:50%;background:var(--paper-card);display:grid;place-items:center;text-align:center"><b class="serif" style="font-size:20px">150</b><small class="faint" style="margin-top:-18px">分</small></div></div>
    <div class="stack" style="gap:8px">${Object.entries(parts).map(([k, v]) => `<div class="row" style="gap:8px"><i style="width:10px;height:10px;border-radius:2px;background:${SUBJ_COLOR[k]}"></i><span style="min-width:72px">${k}</span><b class="mono">${v}%</b></div>`).join('')}</div>
  </div>`
}
function heatColor(v, max) {
  if (!v) return 'background:var(--paper-2);color:var(--ink-3)'
  // 透明度上限 .55，深色文字在最深一档仍有 5:1 以上对比度
  const a = .08 + .47 * Math.min(1, v / max)
  return `background:rgba(47,74,122,${a.toFixed(2)});color:var(--ink)`
}
function legendSubjects() {
  return `<div class="legend">${SUBJECTS.map(s => `<span><i style="background:${SUBJ_COLOR[s]}"></i>${s}</span>`).join('')}</div>`
}

/* ---------------- 弹窗 ---------------- */
function openModal(html, wide = false) {
  closeModal()
  const wrap = document.createElement('div')
  wrap.className = 'overlay'
  wrap.id = 'overlay'
  wrap.innerHTML = `<div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true">${html}</div>`
  wrap.addEventListener('click', e => { if (e.target === wrap) closeModal() })
  document.body.appendChild(wrap)
  const first = wrap.querySelector('input, textarea, select, button')
  if (first) first.focus()
}
function closeModal() { $('#overlay')?.remove() }
ACTIONS['close-modal'] = () => closeModal()

/* ---------------- 渲染 ---------------- */
function render(keepScroll = true) {
  const { route, arg } = parseHash()
  if (!state.user && !PUBLIC.includes(route)) { location.replace('#login'); return }
  const view = VIEWS[route] || VIEWS.home
  const y = scrollY
  $('#root').innerHTML = view(arg)
  scrollTo(0, keepScroll ? y : 0)
  const now = $('.cell.now')
  if (now) now.scrollIntoView({ block: 'nearest', inline: 'center' })
  const msgs = $('.msgs')
  if (msgs) msgs.scrollTop = msgs.scrollHeight
  AFTER.forEach(fn => fn())
}
let lastRoute = ''
addEventListener('hashchange', () => {
  const r = location.hash
  const same = r.split('/')[0] === lastRoute.split('/')[0]
  lastRoute = r
  closeModal()
  render(same)
})

// 打字机：逐字打出、停留、删除后切换下一条；减少动态效果时直接显示全部
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches
let typer = { i: 0, len: 0, del: false, wait: 0 }
setInterval(() => {
  const el = $('[data-typer]')
  if (!el) return
  if (reduceMotion) { el.textContent = PHRASES.join(' · '); return }
  if (typer.wait > 0) { typer.wait--; return }
  const p = PHRASES[typer.i]
  if (!typer.del && typer.len < p.length) typer.len++
  else if (!typer.del) { typer.del = true; typer.wait = 14 }
  else if (typer.len > 0) typer.len--
  else { typer.del = false; typer.i = (typer.i + 1) % PHRASES.length; typer.wait = 3 }
  el.textContent = p.slice(0, typer.len)
}, 110)

/* ---------------- 动态像素方格背景（移植自 PixelField.vue） ----------------
 * 静态底图只画一次；动画帧只重绘被点亮的方格：闲置时随机闪烁，鼠标附近亮起后慢慢褪色。
 * 页面隐藏或离开登录页时停止；减少动态效果时只画静态图；只在精确指针设备上响应鼠标。 */
const PIXEL = { cell: 10, gap: 4, radius: 120, focusX: 0.6, focusY: 0.42, textEnd: 0.4, base: [234, 229, 218], tint: [200, 206, 216], active: [47, 74, 122] }
const finePointer = matchMedia('(hover: hover) and (pointer: fine)').matches
let pixelPointer = null
if (finePointer) {
  addEventListener('pointermove', e => { pixelPointer = { x: e.clientX, y: e.clientY } }, { passive: true })
  document.documentElement.addEventListener('pointerleave', () => { pixelPointer = null })
}
function mountPixelField() {
  const host = $('.auth')
  if (!host || $('.pixel-field', host)) return
  const canvas = document.createElement('canvas')
  canvas.className = 'pixel-field'
  canvas.setAttribute('aria-hidden', 'true')
  host.prepend(canvas)
  const ctx = canvas.getContext('2d')
  const smooth = (a, b, v) => { const t = Math.min(1, Math.max(0, (v - a) / (b - a))); return t * t * (3 - 2 * t) }
  let cells = [], level, target, base, w = 0, h = 0, frame = 0
  function build() {
    const r = canvas.getBoundingClientRect()
    w = Math.max(1, Math.round(r.width)); h = Math.max(1, Math.round(r.height))
    const dpr = Math.min(devicePixelRatio || 1, 2)
    canvas.width = w * dpr; canvas.height = h * dpr
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
    const pitch = PIXEL.cell + PIXEL.gap
    cells = []
    for (let y = PIXEL.gap; y < h; y += pitch) for (let x = PIXEL.gap; x < w; x += pitch) {
      const radial = 1 - smooth(0.15, 0.8, Math.hypot(x / w - PIXEL.focusX, (y / h - PIXEL.focusY) * 1.2))
      const text = 0.25 + 0.75 * smooth(PIXEL.textEnd * 0.35, PIXEL.textEnd, x / w)
      const wt = radial * text * (w < 600 ? 0.55 : 1)
      if (Math.random() < wt * 0.9) cells.push({ x, y, tint: Math.random() < 0.08 * wt + 0.02, a: 0.35 + Math.random() * 0.55 * wt })
    }
    level = new Float32Array(cells.length); target = new Float32Array(cells.length)
    base = document.createElement('canvas'); base.width = canvas.width; base.height = canvas.height
    const b = base.getContext('2d'); b.setTransform(dpr, 0, 0, dpr, 0, 0)
    for (const c of cells) { const [r1, g1, b1] = c.tint ? PIXEL.tint : PIXEL.base; b.fillStyle = `rgba(${r1},${g1},${b1},${c.a})`; b.fillRect(c.x, c.y, PIXEL.cell, PIXEL.cell) }
    draw()
  }
  function draw() {
    ctx.clearRect(0, 0, w, h)
    ctx.drawImage(base, 0, 0, w, h)
    const [tr, tg, tb] = PIXEL.tint, [ar, ag, ab] = PIXEL.active
    for (let i = 0; i < cells.length; i++) {
      const v = level[i]
      if (v < 0.02) continue
      ctx.fillStyle = `rgba(${Math.round(tr + (ar - tr) * v)},${Math.round(tg + (ag - tg) * v)},${Math.round(tb + (ab - tb) * v)},${0.25 + 0.65 * v})`
      ctx.fillRect(cells[i].x, cells[i].y, PIXEL.cell, PIXEL.cell)
    }
  }
  function step() {
    frame = 0
    if (!canvas.isConnected) { observer.disconnect(); return }
    if (document.hidden) { canvas.dataset.running = 'false'; return }
    for (let k = 0; k < 2; k++) if (cells.length && Math.random() < 0.35) target[Math.floor(Math.random() * cells.length)] = 0.35 + Math.random() * 0.35
    const rect = canvas.getBoundingClientRect()
    const p = pixelPointer && { x: pixelPointer.x - rect.left, y: pixelPointer.y - rect.top }
    const r2 = PIXEL.radius * PIXEL.radius
    for (let i = 0; i < cells.length; i++) {
      if (p) { const dx = cells[i].x - p.x, dy = cells[i].y - p.y, d2 = dx * dx + dy * dy; if (d2 < r2) target[i] = Math.max(target[i], 1 - Math.sqrt(d2) / PIXEL.radius) }
      level[i] += (target[i] - level[i]) * 0.14
      target[i] *= 0.94
    }
    draw()
    frame = requestAnimationFrame(step)
  }
  const start = () => { if (!reduceMotion && !frame && !document.hidden && canvas.isConnected) { canvas.dataset.running = 'true'; frame = requestAnimationFrame(step) } }
  const observer = new ResizeObserver(() => build())
  canvas.dataset.running = 'false'
  build()
  if (reduceMotion) return
  observer.observe(canvas)
  document.addEventListener('visibilitychange', () => { if (!document.hidden) start() })
  start()
}
AFTER.push(mountPixelField)

function newSession(kind) {
  let ids
  if (kind === 'diagnostic') {
    ids = SUBJECTS.flatMap(s => QUESTIONS.filter(q => q.s === s).slice(0, 2).map(q => q.id))
  } else {
    const subj = state.cfg.subject
    const pool = [...QUESTIONS.filter(q => q.s === subj), ...QUESTIONS.filter(q => q.s !== subj)]
    ids = pool.slice(0, Math.min(8, state.cfg.count)).map(q => q.id)
  }
  return {
    kind, ids, idx: 0, mode: 'answer', hints: {}, tutor: {}, summary: '',
    title: kind === 'diagnostic' ? '四科单选诊断' : `${state.cfg.subject} · ${state.cfg.difficulty}`,
    items: ids.map(() => ({ draft: null, judged: false, chosen: null, correct: null, assisted: false, saved: null }))
  }
}
// 演示用的进行中练习：已判 3 题、第 6 题有草稿
function ensureSession() {
  if (state.session) return

  const s = newSession('practice')
  s.ids = [101, 102, 103, 104, 105, 106, 107, 108]
  ;[[0, 2], [1, 1], [2, 1]].forEach(([i, c]) => Object.assign(s.items[i], { judged: true, chosen: c, correct: c === qById(s.ids[i]).a }))
  s.items[5].draft = 1
  s.idx = 3
  s.title = '操作系统 · 中等'
  state.session = s
}
const curQ = () => qById(state.session.ids[state.session.idx])
const curItem = () => state.session.items[state.session.idx]

function cellClass(i) {
  const s = state.session, it = s.items[i]
  const c = ['cell']
  if (it.judged) c.push(it.correct ? 'ok' : 'bad')
  else if (it.saved !== null) c.push('draft')
  else if (it.draft !== null) c.push('draft')
  if (i === s.idx) c.push('now')
  if (it.assisted) c.push('assist')
  return c.join(' ')
}
function cellLabel(i) {
  const it = state.session.items[i]
  const st = it.judged ? (it.correct ? '已判对' : '已判错') : it.saved !== null ? `已保存 ${LETTERS[it.saved]}` : it.draft !== null ? `草稿 ${LETTERS[it.draft]}` : '未作答'
  return `第 ${i + 1} 题，${st}${i === state.session.idx ? '，当前题' : ''}`
}

}
function tutorBox(i) {
  const t = state.session.tutor[i] || []
  return `<section class="card tutor" aria-label="错题 AI 辅导">
    <div class="card-h" style="margin-bottom:6px"><h3>错题 AI 辅导</h3><span class="note">围绕这次作答提问，标准答案和判分不变</span></div>
    ${t.map(m => `<p class="q">你的问题：${esc(m.q)}</p><div class="a">${esc(m.a)}</div>`).join('')}
    <form class="row" data-form="tutor" data-idx="${i}" style="margin-top:10px;flex-wrap:nowrap">
      <label class="sr-only" for="tq${i}">错题追问</label><input class="input" id="tq${i}" name="q" placeholder="例如：我的选项错在哪里？能举个例子吗？">
      <button class="key sm" type="submit">追问</button>
    </form>
    <p class="hint-line">每轮保存在任务历史，可在 <button class="link" data-act="go" data-arg="assistant">Agent 助手</button> 继续辅导。</p>
  </section>`
}
FORMS.tutor = f => {
  const q = f.q.value.trim()
  if (!q) { f.q.classList.add('invalid'); return }
  const i = Number(f.dataset.idx)
  const s = state.session
  const qq = qById(s.ids[i])
  const it = s.items[i]
  ;(s.tutor[i] ||= []).push({ q, a: `你选了 ${LETTERS[it.chosen]}「${qq.opts[it.chosen]}」，正确答案是 ${LETTERS[qq.a]}。关键在于：${qq.why}（原型示例回复，实际由 Agent 基于本次作答快照生成）` })
  render()
}

function judge(i) {
  const s = state.session, it = s.items[i], q = qById(s.ids[i])
  const choice = it.draft ?? it.saved
  if (it.judged || choice === null || choice === undefined) return false
  Object.assign(it, { judged: true, chosen: choice, correct: choice === q.a, draft: null })
  state.today.judged += 1
  if (it.correct) state.today.correct += 1
  if (it.assisted) state.today.assisted += 1
  const before = state.mastery[q.s]
  state.mastery[q.s] = Math.max(0, Math.min(100, before + (it.correct ? 2 : -1)))
  state.lastUpdate = `刚刚更新：第 ${i + 1} 题${it.correct ? '判对' : '判错'}，${q.s} ${before} → ${state.mastery[q.s]}`
  if (!it.correct && !state.wrong.some(w => w.qid === q.id)) state.wrong.unshift({ qid: q.id, choice, when: '刚刚', fav: false })
  return true
}
function bump(q) { ['#k-judged', '#k-rate', `[data-subj="${q.s}"] b`].forEach(sel => $(sel)?.classList.add('bump')) }
function choose(i) {
  const it = curItem()
  if (it.judged || i >= curQ().opts.length) return
  it.draft = i
  render()
}
function submitCurrent() {
  const s = state.session, it = curItem()
  if (it.judged || it.draft === null) return
  if (s.kind === 'diagnostic') {
    it.saved = it.draft
    it.draft = null
    if (s.idx < s.ids.length - 1) s.idx++
    render()
    return
  }
  judge(s.idx)
  render()
  bump(curQ())
}
function nextQ() {
  const s = state.session
  const pending = s.items.findIndex((x, i) => i > s.idx && !x.judged)
  if (s.idx === s.ids.length - 1 || (pending === -1 && s.items.every(x => x.judged))) { finishSession(); return }
  s.idx = pending === -1 ? s.idx + 1 : pending
  render()
}
function finishSession() {
  const s = state.session
  s.mode = 'done'
  const answered = s.items.filter(x => x.judged)
  state.records.unshift({ id: 'r' + Date.now(), when: '刚刚', title: s.title, total: s.ids.length, answered: answered.length, correct: answered.filter(x => x.correct).length })
  render(false)
}
ACTIONS.opt = el => choose(Number(el.dataset.arg))
ACTIONS.submit = () => submitCurrent()
ACTIONS.next = () => nextQ()
ACTIONS.move = el => { const n = state.session.idx + Number(el.dataset.arg); if (n >= 0 && n < state.session.ids.length) { state.session.idx = n; render() } }
ACTIONS.jump = el => { state.session.idx = Number(el.dataset.arg); render() }
ACTIONS['enter-review'] = () => { state.session.mode = 'review'; render(false) }
ACTIONS['hand-in'] = () => {
  const s = state.session
  const unanswered = s.items.filter(x => x.saved === null && x.draft === null).length
  openModal(`<h2>交卷并统一判分？</h2><p class="muted">${unanswered ? `还有 <b>${unanswered}</b> 题未作答，未作答的题不计入错题。` : '所有题目都已作答。'}交卷后不能再修改答案。</p>
    <div class="modal-foot"><button class="key sm" data-act="close-modal">继续作答</button><button class="key ink sm" data-act="hand-in-confirm">确认交卷</button></div>`)
}
ACTIONS['hand-in-confirm'] = () => {
  closeModal()
  const s = state.session
  s.items.forEach((_, i) => judge(i))
  finishSession()
}
ACTIONS.ask = el => {
  const s = state.session, q = curQ(), it = curItem()
  if (el.dataset.arg === 'hint') {
    it.assisted = true
    s.hints[s.idx] = `提示：先确定这题属于“${q.k}”，回忆这一知识点的定义或判定条件，再逐个排除选项。（本题已记为辅助作答）`
  } else {
    s.hints[s.idx] = `这题考查 ${q.s} 中的「${q.k}」，难度${q.d}。`
  }
  render()
}
KEYS.session = e => {
  const s = state.session
  if (!s || s.mode !== 'answer' || e.isComposing || e.metaKey || e.ctrlKey || e.altKey) return
  if (e.target.closest('input, textarea, select')) return
  if (e.key === 'Escape' && !$('#overlay')) { go('practice'); return }
  const k = e.key.toUpperCase()
  if (/^[A-D1-4]$/.test(k)) { e.preventDefault(); choose(/\d/.test(k) ? Number(k) - 1 : LETTERS.indexOf(k)); return }
  if (e.key === 'Enter' && !e.target.closest('button')) {
    e.preventDefault()
    const btn = $(curItem().judged ? '[data-act="next"]' : '[data-act="submit"]')
    if (!btn || btn.disabled) return
    btn.classList.add('is-down')
    setTimeout(() => (curItem().judged ? nextQ() : submitCurrent()), 90)
    return
  }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    e.preventDefault()
    const n = s.idx + (e.key === 'ArrowLeft' ? -1 : 1)
    if (n >= 0 && n < s.ids.length) { s.idx = n; render() }
  }
}

function sessionDone() {
  const s = state.session
  const judged = s.items.filter(x => x.judged)
  const right = judged.filter(x => x.correct).length
  return `
  <header class="focus-top"><button class="key sm" data-act="go" data-arg="practice">返回刷题</button><span class="title">${esc(s.title)}</span></header>
  <div class="page" style="max-width:760px">
    <section class="card pad" style="text-align:center;padding:36px 32px">

ACTIONS['ai-summary'] = () => {
  const s = state.session
  s.summary = 'loading'
  render()
  setTimeout(() => {
    const wrongs = s.items.map((x, i) => x.judged && !x.correct ? qById(s.ids[i]).k : null).filter(Boolean)
    s.summary = `本组判错 ${wrongs.length} 题${wrongs.length ? `，集中在：${wrongs.join('、')}` : ''}。\n建议：先回看错题解析，再用“只做错题”范围练一组；需要按步骤推导的题，动笔列出过程再选。\n（原型示例文案，实际由 Agent 根据作答快照生成并计入任务额度）`
    if (parseHash().route === 'session') render()
  }, 900)
}

function sessionReview() {
  const s = state.session
  const total = s.ids.length
  const right = s.items.filter(x => x.judged && x.correct).length
  const wrong = s.items.filter(x => x.judged && !x.correct).length
  const un = s.items.filter(x => !x.judged).length
  const hasPending = s.items.some(x => !x.judged)
  return `
  <header class="focus-top"><button class="key sm" data-act="go" data-arg="practice">返回刷题</button><span class="title">${esc(s.title)} · 回顾</span><span class="spacer"></span>${hasPending ? '<button class="key ink sm" data-act="back-answer">继续作答</button>' : ''}</header>
  <div class="page" style="max-width:900px">
    <div class="review-sum">
      ${[['总题数', total, ''], ['答对', right, 'color:var(--green)'], ['答错', wrong, 'color:var(--red-text)'], ['未作答', un, ''], ['正确率', pct(right, right + wrong) + '%', 'color:var(--pen)']].map(([l, v, st]) => `<div class="card"><div class="big" style="${st}">${v}</div><div class="faint small" style="margin-top:6px">${l}</div></div>`).join('')}
    </div>
    <div class="stack">
      ${s.ids.map((id, i) => {
        const q = qById(id), it = s.items[i]
        const tag = it.judged ? (it.correct ? '<span class="badge green">答对</span>' : '<span class="badge red">答错</span>') : '<span class="badge">未作答</span>'
        return `<article class="card review-item">
          <div class="row" style="margin-bottom:8px"><b class="mono faint">${pad2(i + 1)}</b>${tag}<span class="faint small">${q.s} · ${q.k}</span></div>
          <p class="stem">${esc(q.stem)}</p>
          ${q.code ? `<pre class="code">${esc(q.code)}</pre>` : ''}
          ${q.opts.map((t, j) => { const cls = it.judged && j === q.a ? 'right' : it.judged && j === it.chosen ? 'wrong' : ''; return `<div class="ropt ${cls}"><b>${LETTERS[j]}</b><span>${esc(t)}</span>${it.judged && j === q.a ? '<em>正确答案</em>' : it.judged && j === it.chosen ? '<em>你的选择</em>' : ''}</div>` }).join('')}
          ${it.judged ? `<p class="feedback" style="margin-bottom:0"><b>解析：</b>${esc(q.why)}</p>` : '<p class="faint small" style="margin:10px 0 0">未作答的题不展示答案与解析。</p>'}
          ${it.judged && !it.correct ? tutorBox(i) : ''}
        </article>`
      }).join('')}
    </div>
  </div>`
}
ACTIONS['back-answer'] = () => { const s = state.session; s.mode = 'answer'; const p = s.items.findIndex(x => !x.judged); if (p >= 0) s.idx = p; render(false) }

/* ---------------- 错题本 / 收藏 ---------------- */
let wrongFilter = '全部', favFilter = '全部'
const selected = { wrong: new Set(), favorite: new Set() }
const expanded = new Set()
function qListItem(kind, q, extra) {
  const sel = selected[kind].has(q.id)
  const open = expanded.has(kind + q.id)
  const isFav = state.favorites.includes(q.id)
  return `<article class="card q-item">
    <label class="check" style="margin-top:4px"><input type="checkbox" data-change="pick" data-kind="${kind}" data-id="${q.id}" ${sel ? 'checked' : ''} aria-label="选择题目 ${q.id}"></label>
    <div>
      <p class="stem">${esc(q.stem)}</p>
      <div class="meta"><span class="badge ${kind === 'wrong' ? 'red' : 'pen'}">${kind === 'wrong' ? '错' : '藏'}</span><span>${q.s} · ${q.k}</span>${extra}</div>
    </div>
    <div class="acts">
      <button class="key xs" data-act="expand" data-arg="${kind + q.id}" aria-expanded="${open}">${open ? '收起解析' : '看解析'}</button>
      ${kind === 'wrong' ? `<button class="key xs ${isFav ? 'on' : ''}" data-act="fav" data-arg="${q.id}" aria-pressed="${isFav}">${isFav ? '已收藏' : '收藏'}</button><button class="key xs danger" data-act="unwrong" data-arg="${q.id}">移出错题</button>`
        : `<button class="key xs danger" data-act="unfav" data-arg="${q.id}">取消收藏</button>`}
    </div>
    ${open ? `<div class="detail">
      ${q.opts.map((t, j) => `<div class="ropt ${j === q.a ? 'right' : ''}"><b>${LETTERS[j]}</b><span>${esc(t)}</span>${j === q.a ? '<em>正确答案</em>' : ''}</div>`).join('')}
      <p style="margin:8px 0 0"><b>解析：</b>${esc(q.why)}</p>
    </div>` : ''}
  </article>`
}
function selBar(kind) {
  const n = selected[kind].size
  if (!n) return ''
  return `<div class="sel-bar" role="region" aria-label="批量操作"><b>已选 ${n} 题</b><span class="spacer"></span>
    <button class="key xs" data-act="ask-selected" data-arg="${kind}">让助手讲解</button>
    <button class="key xs" data-act="practice-selected" data-arg="${kind}">重练这些题</button>
    <button class="link" style="color:#f4f1ea" data-act="clear-sel" data-arg="${kind}">取消选择</button></div>`
}
function filterChips(act, current, list) {
  return `<div class="chips" role="group" aria-label="按科目筛选" style="margin-bottom:16px">${['全部', ...SUBJECTS].map(s => `<button class="chip" data-act="${act}" data-arg="${s}" aria-pressed="${current === s}">${s} ${s === '全部' ? list.length : list.filter(q => q.s === s).length}</button>`).join('')}</div>`
}
VIEWS.wrong = () => {
  const all = state.wrong.map(w => ({ ...qById(w.qid), w }))
  const list = wrongFilter === '全部' ? all : all.filter(q => q.s === wrongFilter)
  return shell('wrong', `<div class="page">
    ${pageHead('错题本', '判错的题自动归集。助手按前 50 题识别列表序号；可勾选具体题目（最多 50 题）后操作。', `<button class="key sm" data-act="wrong-practice" ${all.length ? '' : 'disabled'}>只做错题练一组</button>`)}
    ${filterChips('wf', wrongFilter, all)}
    ${selBar('wrong')}
    <div class="stack" style="gap:12px">${list.length ? list.map(q => qListItem('wrong', q, `<span>${q.w.when}判错 · 你的选择 ${LETTERS[q.w.choice]}</span>`)).join('') : `<div class="card">${empty(all.length ? '这个科目暂时没有错题' : '暂时没有错题', all.length ? '换个科目看看。' : '继续刷题，判错的题会自动出现在这里。', all.length ? '' : '<button class="key ink sm" data-act="go" data-arg="practice">去刷题</button>')}</div>`}</div>
    ${list.length ? '<p class="faint small" style="text-align:center;margin-top:18px">已显示全部</p>' : ''}
  </div>`)
}
VIEWS.favorite = () => {
  const all = state.favorites.map(qById)
  const list = favFilter === '全部' ? all : all.filter(q => q.s === favFilter)
  return shell('favorite', `<div class="page">
    ${pageHead('我的收藏', '重点题目回看。助手按前 50 题识别列表序号；可勾选具体题目（最多 50 题）后操作。')}
    ${filterChips('ff', favFilter, all)}
    ${selBar('favorite')}
    <div class="stack" style="gap:12px">${list.length ? list.map(q => qListItem('favorite', q, '')).join('') : `<div class="card">${empty('还没有收藏题目', '在错题本或答题后点“收藏”，题目会出现在这里。')}</div>`}</div>
  </div>`)
}
ACTIONS.wf = el => { wrongFilter = el.dataset.arg; render() }
ACTIONS.ff = el => { favFilter = el.dataset.arg; render() }
ACTIONS.expand = el => { const k = el.dataset.arg; expanded.has(k) ? expanded.delete(k) : expanded.add(k); render() }
ACTIONS.fav = el => { const id = Number(el.dataset.arg); const i = state.favorites.indexOf(id); i >= 0 ? state.favorites.splice(i, 1) : state.favorites.push(id); toast(i >= 0 ? '已取消收藏' : '已收藏'); render() }
ACTIONS.unfav = el => { const id = Number(el.dataset.arg); state.favorites = state.favorites.filter(x => x !== id); selected.favorite.delete(id); toast('已取消收藏'); render() }
ACTIONS.unwrong = el => {
  const id = Number(el.dataset.arg)
  openModal(`<h2>移出错题本？</h2><p class="muted">移出后这道题不再出现在错题本，原始作答记录仍保留，可在练习回顾中查看。</p>
    <div class="modal-foot"><button class="key sm" data-act="close-modal">取消</button><button class="key sm danger" data-act="unwrong-confirm" data-arg="${id}">移出错题</button></div>`)
}
ACTIONS['unwrong-confirm'] = el => { const id = Number(el.dataset.arg); state.wrong = state.wrong.filter(w => w.qid !== id); selected.wrong.delete(id); closeModal(); toast('已移出错题本'); render() }
INPUTS.pick = el => { const set = selected[el.dataset.kind]; const id = Number(el.dataset.id); el.checked ? set.add(id) : set.delete(id); render() }
ACTIONS['clear-sel'] = el => { selected[el.dataset.arg].clear(); render() }
ACTIONS['ask-selected'] = el => {
  const ids = [...selected[el.dataset.arg]]
  startConversation(`帮我讲解这 ${ids.length} 道题的共同易错点：${ids.map(id => qById(id).k).join('、')}`)
  selected[el.dataset.arg].clear()
}
ACTIONS['practice-selected'] = el => {
  const ids = [...selected[el.dataset.arg]]
  const s = newSession('practice')
  s.ids = ids
  s.items = ids.map(() => ({ draft: null, judged: false, chosen: null, correct: null, assisted: false, saved: null }))
  s.title = `重练 · ${ids.length} 题`
  state.session = s
  selected[el.dataset.arg].clear()
  go('session')
}
ACTIONS['wrong-practice'] = () => {
  selected.wrong = new Set(state.wrong.map(w => w.qid))
  ACTIONS['practice-selected']({ dataset: { arg: 'wrong' } })
}

    <ul><li><b>冲：</b>示例院校 乙（往年参考线约 336）</li><li><b>稳：</b>示例院校 戊（约 302）</li></ul>

  if (m.kind === 'stopped') return `${md(m.text)}<p class="faint small" style="margin:6px 0 0">已停止生成</p><div class="msg-acts"><button class="key xs" data-act="retry" data-arg="${m.id}">重试此问题</button></div>`
  return `<div class="md">${md(m.text)}</div>${m.src && m.done ? `<div class="src">依据：${m.src.map(esc).join('；')}</div>` : ''}`
}
function replyFor(text) {
  if (!state.privacy.model) return { kind: 'privacy', text: '' }
  if (/笔记/.test(text)) return { kind: 'note', text: '' }
  if (/安排|计划|复习什么|学情/.test(text)) return { kind: 'plan', text: '' }
  if (/院校|择校|专硕|学硕|分数线/.test(text)) return { kind: 'school', text: '' }
  return { kind: 'answer', text: '先说结论：这类题要先找出决定答案的那个条件。\n### 思路\n- 读题时圈出限制条件（初值、规模、方式）\n- 回到定义，写出判定公式\n- 用公式逐个排除选项\n\n需要的话，我可以从你的错题里挑两道同类题一起讲。', src: ['备考资料（示例）', '你的近 30 天作答记录'] }
}
function sendMessage(text, drawer = false) {
  text = text.trim()
  if (!text || state.generating) return
  const c = conv()
  ensureMessages(c)
  if (c.messages.length === 0 && c.title === '新会话') c.title = text.slice(0, 16)
  c.messages.push({ me: true, text, id: ++msgSeq, done: true })
  const r = replyFor(text)
  const m = { ...r, id: ++msgSeq, done: false, shown: '', q: text }
  c.messages.push(m)
  state.generating = true
  state.attachNotes = []
  render()
  // 流式输出：answer 逐字出现；其他类型短暂“生成中”后整块出现
  const full = m.text
  let i = 0
  const tick = setInterval(() => {
    if (!state.generating) { clearInterval(tick); return }
    if (m.kind === 'answer' && i < full.length) {
      i = Math.min(full.length, i + 3)
      m.shown = full.slice(0, i)
      const el = $('#m-' + m.id)
      if (el) el.innerHTML = `<div class="md">${md(m.shown)}</div><span class="caret"></span>`
      const box = $('.msgs')
      if (box) box.scrollTop = box.scrollHeight
      return
    }
    if (m.kind !== 'answer' && i < 8) { i++; return }
    clearInterval(tick)
    m.done = true
    state.generating = false
    render()
  }, 40)
}
function stopGenerating() {
  const c = conv()
  const m = c.messages[c.messages.length - 1]
  if (m && !m.done) { m.done = true; m.kind = 'stopped'; m.text = m.shown || '' }
  state.generating = false
  render()
}
function startConversation(text) {
  const c = { id: 'c' + Date.now(), title: text.slice(0, 16), when: '刚刚', messages: [] }
  state.conversations.unshift(c)
  state.convId = c.id
  state.assistantOpen = false
  go('assistant')
  setTimeout(() => sendMessage(text), 60)
}
