<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>考研 Agent 原型</title>
<style>
  :root {
    --paper: #f4f1ea; --paper-card: #fbf9f4; --paper-2: #ece7dc; --paper-3: #e3ddcf;
    --ink: #23211d; --ink-2: #5c574e; --ink-3: #6f695f; --rule: #d8d1c2;
    --pen: #2f4a7a; --pen-deep: #1e3152; --pen-tint: #e4e6e6; --red: #b23a2e; --green: #2e6b4f;
    --serif: "Songti SC", "Noto Serif SC", "Source Han Serif SC", "STSong", serif;
    --sans: -apple-system, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
    --travel: 2px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: var(--sans); font-size: 14px; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .serif { font-family: var(--serif); }

  /* ================= 键帽按键 ================= */
  .key {
    appearance: none; border: 0; cursor: pointer; position: relative;
    height: 46px; padding: 0 20px; border-radius: 9px;
    display: inline-flex; align-items: center; justify-content: center; gap: 12px;
    font: 600 15px/1 var(--sans); letter-spacing: .02em; color: var(--ink);
    background: linear-gradient(180deg, #fffdf8 0%, #f1ece1 100%);
    box-shadow: inset 0 1px 0 #fff, 0 0 0 1px #cfc6b3, 0 var(--travel) 0 1px #c6bca7, 0 calc(var(--travel) + 6px) 12px -6px rgba(35,33,29,.4);
    transition: transform .06s ease-out, box-shadow .06s ease-out;
    white-space: nowrap;
  }
  .key:hover { background: linear-gradient(180deg, #fff 0%, #f5f1e8 100%); }
  .key:active, .key.is-down { transform: translateY(var(--travel)); box-shadow: inset 0 1px 0 #fff, 0 0 0 1px #cfc6b3, 0 0 0 1px #c6bca7, 0 2px 4px -2px rgba(35,33,29,.35); }
  .key:focus-visible { outline: 3px solid var(--pen); outline-offset: 4px; }
  .key.sm { height: 38px; padding: 0 14px; font-size: 14px; border-radius: 8px; gap: 8px; }
  .key.block { width: 100%; justify-content: space-between; }
  .key.ink { color: #fff; background: linear-gradient(180deg, #3a5788 0%, #2b4573 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 0 0 1px #233a62, 0 var(--travel) 0 1px var(--pen-deep), 0 calc(var(--travel) + 6px) 14px -6px rgba(30,49,82,.6); }
  .key.ink:hover { background: linear-gradient(180deg, #3f5d90 0%, #2f4a7a 100%); }
  .key.ink:active, .key.ink.is-down { box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 0 0 1px #233a62, 0 0 0 1px var(--pen-deep), 0 2px 4px -2px rgba(30,49,82,.5); }
  .key.danger { color: var(--red); }
  .key:disabled { color: rgba(35,33,29,.38); background: #ece7dc; box-shadow: 0 0 0 1px #d8d1c2; transform: translateY(var(--travel)); cursor: not-allowed; }
  .key.ink:disabled { color: rgba(255,255,255,.75); background: #8d9bb3; box-shadow: 0 0 0 1px #8193ae; }
  .glyph { font: 500 12px var(--mono); padding: 3px 6px; border-radius: 5px; background: rgba(35,33,29,.07); color: var(--ink-2); }
  .key.ink .glyph { background: rgba(255,255,255,.16); color: rgba(255,255,255,.92); }
  .key.opt { width: 46px; padding: 0; font: 700 17px var(--mono); flex: none; }
  .link { appearance: none; border: 0; background: none; padding: 0; color: var(--pen); font-weight: 600; cursor: pointer; }
  .link:hover { text-decoration: underline; text-underline-offset: 3px; }
  .link:focus-visible { outline: 2px solid var(--pen); outline-offset: 3px; border-radius: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  /* ================= 原型标记 ================= */
  .proto-flag {
    position: fixed; right: 12px; bottom: 12px; z-index: 50;
    font-size: 12px; color: var(--ink-2); background: rgba(251,249,244,.95);
    padding: 6px 10px; border-radius: 6px; box-shadow: 0 0 0 1px var(--rule);
  }

  /* ================= 登录 ================= */
  .login { min-height: 100vh; display: grid; grid-template-columns: 1fr 460px; position: relative; overflow: hidden; }
  .login::before {
    content: ""; position: absolute; inset: 0; z-index: -1;
    background-image: linear-gradient(rgba(35,33,29,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(35,33,29,.045) 1px, transparent 1px);
    background-size: 14px 14px;
  }
  .login-stage { padding: 56px 64px; display: grid; grid-template-columns: minmax(0, 420px) auto; justify-content: space-between; align-items: center; gap: 40px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; color: var(--ink-2); margin-bottom: 40px; }
  .mark { width: 40px; height: 40px; border-radius: 9px; display: block; }
  .top .mark { width: 28px; height: 28px; border-radius: 7px; }
  .display { font-family: var(--serif); font-size: 60px; line-height: 1.1; font-weight: 700; margin: 0 0 16px; }
  .typer { font: 600 17px var(--mono); color: var(--pen); margin: 0 0 22px; }
  .slogan { font-family: var(--serif); font-size: 21px; font-weight: 700; letter-spacing: .2em; margin: 0 0 10px; }
  .desc { color: var(--ink-2); margin: 0 0 26px; }
  .feat { list-style: none; margin: 0; padding: 20px 0 0; border-top: 1px solid var(--rule); display: grid; gap: 8px; }
  .feat span { font: 12px var(--mono); color: var(--ink-3); margin-right: 14px; }
  .sheet {
    width: 340px; padding: 22px 22px 18px; background: var(--paper-card); border-radius: 6px;
    box-shadow: 0 0 0 1px var(--rule), 0 24px 48px -30px rgba(35,33,29,.45);
    transform: rotate(-1.5deg); animation: bob 6s ease-in-out infinite;
  }
  @keyframes bob { 50% { translate: 0 -10px; } }
  .sheet-head { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 12px; margin-bottom: 14px; border-bottom: 1px solid var(--rule); }
  .sheet-head b { font-family: var(--serif); font-size: 18px; letter-spacing: .1em; }
  .sheet-head span { font-size: 12px; color: var(--ink-3); }
  .sheet-row { display: grid; grid-template-columns: 64px 1fr; gap: 8px; align-items: center; margin-bottom: 10px; font-size: 12px; color: var(--ink-2); }
  .mini { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
  .mini i { height: 22px; border-radius: 3px; border: 1px solid var(--rule); position: relative; }
  .mini i.d, .mini i.w { background: var(--paper-3); border-color: var(--paper-3); }
  .mini i.w::after { content: ""; position: absolute; left: 3px; right: 3px; top: 50%; height: 2px; background: var(--red); transform: rotate(-28deg); border-radius: 2px; }
  .mini i.f { border-style: dashed; border-color: var(--pen); }
  .mini i.n { border: 2px solid var(--ink); }
  .login-side { display: grid; place-items: center; padding: 40px; }
  .card { background: var(--paper-card); border-radius: 10px; box-shadow: 0 0 0 1px var(--rule), 0 30px 60px -40px rgba(35,33,29,.5); }
  .login-card { width: 100%; max-width: 380px; padding: 36px 32px 28px; }
  .login-card h2 { font-family: var(--serif); font-size: 28px; margin: 0 0 4px; }
  .login-card p { color: var(--ink-2); margin: 0 0 26px; }
  .field { display: block; margin-bottom: 16px; }
  .field input, .textarea, .search input {
    width: 100%; height: 46px; padding: 0 14px; border: 0; border-radius: 8px; outline: none;
    background: #fffdf8; color: var(--ink); font: 16px var(--sans);
    box-shadow: inset 0 1px 2px rgba(35,33,29,.08), inset 0 0 0 1px var(--rule);
  }
  .field input::placeholder, .textarea::placeholder, .search input::placeholder { color: var(--ink-3); }
  .field input:focus, .textarea:focus, .search input:focus { box-shadow: inset 0 0 0 1px var(--pen), 0 0 0 3px rgba(47,74,122,.16); }
  .err { color: var(--red); font-size: 13px; min-height: 20px; margin: -8px 0 8px; }
  .login-foot { text-align: center; margin-top: 18px; color: var(--ink-2); font-size: 13px; }

  /* ================= 应用外壳 ================= */
  .top {
    position: sticky; top: 0; z-index: 10;
    height: 56px; display: flex; align-items: center; gap: 36px; padding: 0 32px;
    background: rgba(244,241,234,.94); border-bottom: 1px solid var(--rule);
  }
  .top .logo { font-family: var(--serif); font-size: 19px; font-weight: 700; }
  .proto-badge { display: none; margin-left: -4px; }
  .nav { display: flex; gap: 6px; }
  .nav button { appearance: none; border: 0; background: none; cursor: pointer; padding: 6px 12px; border-radius: 6px; color: var(--ink-2); font-size: 14px; }
  .nav button:hover { background: var(--paper-2); color: var(--ink); }
  .nav button[aria-current="page"] { color: var(--ink); font-weight: 700; background: var(--paper-2); }
  .nav button:focus-visible { outline: 2px solid var(--pen); }
  .top .me { margin-left: auto; display: flex; align-items: center; gap: 14px; color: var(--ink-2); font-size: 13px; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--paper-3); display: grid; place-items: center; font-family: var(--serif); font-weight: 700; color: var(--ink); }
  .tabbar { display: none; }
  .page { max-width: 1240px; margin: 0 auto; padding: 32px; }
  .page-title { font-family: var(--serif); font-size: 26px; margin: 0 0 4px; }
  .page-sub { color: var(--ink-2); margin: 0 0 24px; }
  .label { font-size: 12px; color: var(--ink-3); letter-spacing: .12em; margin-bottom: 12px; }
  .toast {
    position: fixed; left: 50%; top: 72px; z-index: 60; transform: translate(-50%, -8px); opacity: 0; pointer-events: none;
    background: var(--ink); color: #f4f1ea; padding: 8px 16px; border-radius: 8px; font-size: 13px;
    transition: opacity .2s ease, transform .2s ease;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ================= 刷题设置（默认填写） ================= */
  .home { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 40px; align-items: start; }
  .config { padding: 28px 30px; }
  .cfg-row { display: grid; grid-template-columns: 56px 1fr; gap: 16px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--paper-2); }
  .cfg-row:nth-last-child(2) { border-bottom: 0; }
  .cfg-row > span { color: var(--ink-2); font-size: 13px; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip {
    appearance: none; border: 0; cursor: pointer; height: 34px; padding: 0 14px; border-radius: 7px;
    background: var(--paper-card); color: var(--ink-2); font-size: 14px;
    box-shadow: 0 0 0 1px var(--rule);
  }
  .chip:hover { color: var(--ink); box-shadow: 0 0 0 1px var(--ink-3); }
  .chip[aria-pressed="true"] { background: var(--pen-tint); color: var(--pen); font-weight: 600; box-shadow: 0 0 0 1.5px var(--pen); }
  .chip:focus-visible { outline: 2px solid var(--pen); outline-offset: 2px; }
  .cfg-foot { display: flex; align-items: center; gap: 16px; margin-top: 22px; padding-top: 20px; border-top: 1px solid var(--rule); }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 4px; background: var(--paper-2); color: var(--ink-2); }
  .badge.pen { background: var(--pen-tint); color: var(--pen); }
  .summary { color: var(--ink-2); }
  .summary b { color: var(--ink); }
  .today { padding: 24px 26px; }
  .big { font-family: var(--serif); font-size: 36px; font-weight: 700; line-height: 1; }
  .big small { font-size: 14px; font-weight: 400; color: var(--ink-2); margin-left: 2px; }
  .kpis { display: flex; gap: 32px; margin-bottom: 22px; }
  .kpis .cap { color: var(--ink-3); font-size: 12px; margin-top: 6px; }
  .subj { display: grid; grid-template-columns: 72px 1fr 30px; gap: 10px; align-items: center; margin-bottom: 12px; color: var(--ink-2); font-size: 13px; }
  .subj.on { color: var(--ink); font-weight: 600; }
  .bar { height: 4px; border-radius: 2px; background: var(--paper-3); overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--ink-2); border-radius: 2px; transition: width .6s cubic-bezier(.2,.7,.2,1); }
  .subj.on .bar span { background: var(--pen); }
  .subj b { font: 500 12px var(--mono); text-align: right; }
  .bump { animation: bump .6s ease; }
  @keyframes bump { 30% { color: var(--pen); transform: translateY(-2px); } }
  .recent { margin-top: 28px; }
  .recent li { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--paper-2); color: var(--ink-2); }
  .recent ul { list-style: none; padding: 0; margin: 0; }

  /* ================= 刷题页 ================= */
  .desk { display: grid; grid-template-columns: 220px minmax(0, 1fr) 290px; gap: 48px; max-width: 1360px; margin: 0 auto; padding: 32px; }
  .answer-card { display: grid; grid-template-columns: repeat(4, 40px); gap: 8px; }
  .cell {
    appearance: none; cursor: pointer; position: relative; height: 40px; border-radius: 4px;
    display: grid; place-items: center; font: 13px var(--mono); color: var(--ink-2);
    background: transparent; border: 1px solid var(--rule);
  }
  .cell:hover { border-color: var(--ink-3); }
  .cell:focus-visible { outline: 2px solid var(--pen); outline-offset: 2px; }
  .cell.ok, .cell.bad { background: var(--paper-3); border-color: var(--paper-3); color: var(--ink); }
  .cell.bad { color: #962a20; }
  .cell.bad::after { content: ""; position: absolute; left: 7px; right: 7px; top: 50%; height: 2px; margin-top: -1px; border-radius: 2px; background: var(--red); transform: rotate(-26deg); animation: stroke .35s ease-out; }
  @keyframes stroke { from { transform: rotate(-26deg) scaleX(0); } }
  .cell.draft { border-style: dashed; border-color: var(--pen); color: var(--pen); }
  .cell.now { border: 2px solid var(--ink); color: var(--ink); font-weight: 700; }
  .cell.assist::before { content: ""; position: absolute; right: 3px; top: 3px; width: 5px; height: 5px; border-radius: 50%; background: var(--pen); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 14px; font-size: 12px; color: var(--ink-3); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .side-stats { margin-top: 36px; }
  .sheet-paper { max-width: 700px; width: 100%; justify-self: center; }
  .q-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--ink-3); font-size: 13px; margin-bottom: 16px; }
  .q-meta strong { color: var(--ink); font-family: var(--serif); font-size: 16px; }
  .stem { font-family: var(--serif); font-size: 18px; line-height: 1.85; margin: 0 0 18px; }
  pre.code { margin: 0 0 22px; padding: 14px 18px; background: var(--paper-2); border-radius: 4px; font: 14px/1.75 var(--mono); overflow-x: auto; }
  .opts { display: grid; gap: 8px; }
  .opt-row {
    appearance: none; border: 0; background: transparent; cursor: pointer; text-align: left;
    display: flex; align-items: center; gap: 16px; padding: 8px 10px 8px 6px; border-radius: 8px;
    font: 17px/1.5 var(--serif); color: var(--ink);
  }
  .opt-row:hover { background: rgba(227,221,207,.45); }
  .opt-row:focus-visible { outline: 2px solid var(--pen); outline-offset: 2px; }
  .opt-row .key { pointer-events: none; }
  .opt-row[aria-checked="true"] { color: var(--pen); }
  .opt-row[aria-checked="true"] .key { color: #fff; background: linear-gradient(180deg, #3a5788, #2b4573); box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 0 0 1px #233a62, 0 0 0 1px var(--pen-deep), 0 2px 4px -2px rgba(30,49,82,.5); transform: translateY(var(--travel)); }
  .opt-row.right { color: var(--green); }
  .opt-row.wrong { color: var(--red); }
  .opt-row.right .key { color: #fff; background: var(--green); box-shadow: 0 0 0 1px #24553e; transform: translateY(var(--travel)); }
  .opt-row.wrong .key { color: #fff; background: var(--red); box-shadow: 0 0 0 1px #8f2e25; transform: translateY(var(--travel)); }
  .opt-row.locked { cursor: default; }
  .opt-row.locked:hover { background: transparent; }
  .opt-tag { margin-left: auto; font: 12px var(--sans); color: var(--ink-3); }
  .opt-row.right .opt-tag { color: var(--green); font-weight: 600; }
  .opt-row.wrong .opt-tag { color: var(--red); font-weight: 600; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 6px; background: var(--paper-card); box-shadow: 0 0 0 1px var(--rule); font-size: 14px; line-height: 1.75; }
  .feedback b.ok { color: var(--green); } .feedback b.bad { color: var(--red); }
  .act { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin-top: 22px; padding-top: 20px; border-top: 1px solid var(--rule); }
  .act .status { color: var(--ink-2); font-size: 13px; }
  .act .status b { color: var(--pen); }
  .act .pager { margin-left: auto; display: flex; gap: 10px; }
  .hint-line { margin-top: 14px; color: var(--ink-3); font-size: 12px; }
  .hint-line kbd { font: 11px var(--mono); padding: 1px 5px; border-radius: 4px; background: var(--paper-2); color: var(--ink-2); }
  .margin { border-left: 1px solid var(--rule); padding-left: 26px; }
  .ask-box { background: var(--paper-2); border-radius: 6px; padding: 12px 14px; color: var(--ink-2); font-size: 13px; line-height: 1.7; min-height: 64px; }
  .ask-box.answered { background: var(--paper-card); box-shadow: 0 0 0 1px var(--rule); color: var(--ink); }
  .ask-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .note-mini { margin-top: 30px; }
  .lined {
    width: 100%; min-height: 120px; resize: vertical; border: 0; outline: none; background-color: transparent; padding: 0;
    font: 16px/1.9 var(--serif); color: var(--ink);
    background-image: linear-gradient(transparent calc(1.9em - 1px), var(--rule) calc(1.9em - 1px)); background-size: 100% 1.9em;
  }
  .lined:focus { background-color: rgba(255,253,248,.6); }

  /* ================= 完成页 ================= */
  .done-wrap { max-width: 720px; margin: 40px auto; padding: 36px 40px; text-align: center; }
  .done-wrap .mini { max-width: 360px; margin: 18px auto 24px; grid-template-columns: repeat(8, 1fr); }
  .done-wrap .row-k { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }

  /* ================= 学情 ================= */
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
  .stats-grid .card { padding: 24px 26px; }
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 14px; align-items: end; height: 170px; margin-top: 8px; }
  .week div { display: grid; gap: 6px; justify-items: center; align-self: end; font-size: 12px; color: var(--ink-3); }
  .week span.col { width: 26px; border-radius: 3px 3px 0 0; background: var(--paper-3); position: relative; }
  .week span.col i { position: absolute; left: 0; right: 0; bottom: 0; background: var(--pen); border-radius: 3px 3px 0 0; opacity: .85; }
  .week b { font: 500 11px var(--mono); color: var(--ink-2); }
  .weak li { display: grid; grid-template-columns: 1fr auto; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--paper-2); }
  .weak ul { list-style: none; padding: 0; margin: 0; }
  .weak small { color: var(--ink-3); }

  /* ================= 错题本 ================= */
  .wrong-list { display: grid; gap: 14px; }
  .wrong-item { padding: 20px 24px; display: grid; grid-template-columns: 1fr auto; gap: 8px 24px; align-items: start; }
  .wrong-item .stem { font-size: 16px; margin: 0; }
  .wrong-item .meta { color: var(--ink-3); font-size: 12px; }
  .wrong-item .acts { display: flex; gap: 10px; grid-row: span 2; align-self: center; }
  .empty { padding: 48px; text-align: center; color: var(--ink-2); }
  .filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }

  /* ================= Agent 问答 ================= */
  .chat { max-width: 820px; margin: 0 auto; display: grid; grid-template-rows: 1fr auto; min-height: calc(100vh - 56px - 64px); }
  .msgs { display: grid; gap: 18px; align-content: start; padding-bottom: 24px; }
  .msg { max-width: 82%; padding: 12px 16px; border-radius: 10px; line-height: 1.8; font-size: 15px; }
  .msg.me { justify-self: end; background: var(--pen); color: #fff; border-bottom-right-radius: 3px; }
  .msg.bot { background: var(--paper-card); box-shadow: 0 0 0 1px var(--rule); border-bottom-left-radius: 3px; }
  .msg.bot .src { display: block; margin-top: 8px; font-size: 12px; color: var(--ink-3); }
  .composer { position: sticky; bottom: 0; padding: 14px 0 18px; background: var(--paper); display: grid; gap: 10px; }
  .composer-row { display: flex; gap: 12px; }
  .textarea { height: 46px; padding: 12px 14px; resize: none; line-height: 1.4; }

  /* ================= 院校 ================= */
  .search { display: flex; gap: 12px; margin-bottom: 18px; }
  .search input { flex: 1; }
  .school-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .school { padding: 20px 22px; }
  .school h3 { font-family: var(--serif); font-size: 18px; margin: 0 0 6px; }
  .school .tags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .school dl { display: grid; grid-template-columns: 76px 1fr; gap: 4px 12px; margin: 0; font-size: 13px; }
  .school dt { color: var(--ink-3); }
  .school dd { margin: 0; }
  .pending { color: var(--ink-3); }

  /* ================= 笔记 ================= */
  .notes { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 32px; }
  .note-list { display: grid; gap: 8px; align-content: start; }
  .note-btn { appearance: none; border: 0; text-align: left; cursor: pointer; padding: 12px 14px; border-radius: 8px; background: transparent; color: var(--ink-2); }
  .note-btn:hover { background: var(--paper-2); }
  .note-btn[aria-current="true"] { background: var(--paper-card); color: var(--ink); box-shadow: 0 0 0 1px var(--rule); }
  .note-btn b { display: block; font-family: var(--serif); font-size: 15px; color: var(--ink); }
  .note-btn small { color: var(--ink-3); }
  .note-btn:focus-visible { outline: 2px solid var(--pen); }
  .editor { padding: 26px 30px; }
  .editor input.title { width: 100%; border: 0; outline: none; background: transparent; font: 700 22px var(--serif); color: var(--ink); margin-bottom: 14px; }
  .editor .lined { min-height: 300px; }
  .editor-foot { display: flex; align-items: center; gap: 14px; margin-top: 16px; color: var(--ink-3); font-size: 12px; }
  .editor-foot .key { margin-left: auto; }

  /* ================= 窄屏 ================= */
  @media (max-width: 1100px) {
    .desk { grid-template-columns: 180px minmax(0, 1fr); }
    .margin { grid-column: 1 / -1; border-left: 0; padding-left: 0; border-top: 1px solid var(--rule); padding-top: 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
    .note-mini { margin-top: 0; }
    .answer-card { grid-template-columns: repeat(4, 36px); }
    .cell { height: 36px; }
  }
  @media (max-width: 900px) {
    .login { grid-template-columns: 1fr; }
    .login-stage { display: block; padding: 28px 20px 8px; }
    .login-stage .sheet { display: none; }
    .brand { margin-bottom: 18px; }
    .display { font-size: 40px; margin-bottom: 8px; }
    .typer { font-size: 15px; margin-bottom: 12px; }
    .slogan { font-size: 17px; letter-spacing: .14em; margin: 0; }
    .desc, .feat { display: none; }
    .login-side { padding: 16px 16px 40px; }
    .login-card { max-width: none; padding: 28px 20px 24px; }
    .home, .stats-grid, .notes { grid-template-columns: 1fr; }
    .school-list { grid-template-columns: 1fr; }
  }
  @media (max-width: 760px) {
    body { font-size: 15px; }
    .top { padding: 0 16px; gap: 12px; height: 52px; }
    .top .nav, .top .me span:not(.avatar) { display: none; }
    .tabbar {
      display: grid; grid-template-columns: repeat(5, 1fr);
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; height: 60px;
      background: rgba(244,241,234,.97); border-top: 1px solid var(--rule); padding-bottom: env(safe-area-inset-bottom);
    }
    .tabbar button { appearance: none; border: 0; background: none; color: var(--ink-3); font-size: 12px; display: grid; place-items: center; gap: 2px; padding: 6px 0; }
    .tabbar button i { font: 700 15px var(--serif); font-style: normal; }
    .tabbar button[aria-current="page"] { color: var(--pen); font-weight: 700; }
    .app { padding-bottom: 76px; }
    .page { padding: 20px 16px; }
    .page-title { font-size: 22px; }
    .desk { display: block; padding: 0 16px; }
    .card-side { position: sticky; top: 52px; z-index: 5; background: var(--paper); margin: 0 -16px; padding: 10px 16px; border-bottom: 1px solid var(--rule); }
    .card-side .label, .card-side .legend, .side-stats { display: none; }
    .answer-card { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
    .cell { flex: none; width: 40px; height: 40px; }
    .sheet-paper { padding-top: 18px; }
    .stem { font-size: 17px; }
    .opt-row { font-size: 16px; padding: 6px 4px; }
    .act { position: sticky; bottom: 60px; z-index: 4; background: var(--paper); margin: 22px -16px 0; padding: 12px 16px; border-top: 1px solid var(--rule); }
    .act .status { order: 3; width: 100%; font-size: 12px; }
    .act .key.ink { flex: 1; justify-content: space-between; }
    .act .pager { margin-left: 0; }
    .act .key.sm { height: 44px; }
    .hint-line { display: none; }
    .margin { display: block; margin-top: 24px; }
    .note-mini { margin-top: 24px; }
    .wrong-item { grid-template-columns: 1fr; }
    .wrong-item .acts { grid-row: auto; }
    .search { flex-direction: column; }
    .msg { max-width: 92%; }
    .composer { bottom: 60px; }
    .chat { min-height: calc(100vh - 52px - 100px); }
    .key.sm { height: 44px; }
    .done-wrap { margin: 16px; padding: 28px 20px; }
    .proto-flag { display: none; }
    .proto-badge { display: inline-block; }
    .kpis { gap: 24px; }
  }
</style>
</head>

/* ---------------- 刷题 ---------------- */
function cellClass(i) {
  const it = state.items[i]
  const cls = ['cell']
  if (it.judged) cls.push(it.correct ? 'ok' : 'bad')
  else if (it.draft !== null) cls.push('draft')
  if (i === state.idx) cls.push('now')
  if (it.assisted) cls.push('assist')
  return cls.join(' ')
}
function cellLabel(i) {
  const it = state.items[i]
  const s = it.judged ? (it.correct ? '已判对' : '已判错') : it.draft !== null ? `草稿 ${LETTERS[it.draft]}` : '未作答'
  return `第 ${i + 1} 题，${s}${i === state.idx ? '，当前题' : ''}`
}
function viewPractice() {
  const q = QUESTIONS[state.idx]
  const it = state.items[state.idx]
  const sel = it.judged ? it.chosen : it.draft
  const last = state.idx === QUESTIONS.length - 1
  const optRows = q.opts.map((t, i) => {
    let cls = 'opt-row'
    let tag = ''
    if (it.judged) {
      cls += ' locked'
      if (i === q.a) { cls += ' right'; tag = '正确答案' }
      else if (i === it.chosen) { cls += ' wrong'; tag = '你的选择' }
    }
    return `<button class="${cls}" role="radio" aria-checked="${sel === i}" data-opt="${i}" ${it.judged ? 'aria-disabled="true"' : ''}>
      <span class="key opt" aria-hidden="true">${LETTERS[i]}</span><span>${esc(t)}</span><span class="opt-tag">${tag}</span></button>`
  }).join('')
  const status = it.judged
    ? (it.correct ? '已判对' : `已判错，正确答案 <b>${LETTERS[q.a]}</b>`) + (it.assisted ? ' · 辅助作答' : '')
    : sel !== null ? `已选 <b>${LETTERS[sel]}</b>，提交前可修改 · 草稿已保存` : '选择一个答案，草稿会自动保存'
  const mainKey = it.judged
    ? `<button class="key ink" data-next>${last ? '完成，查看结果' : '下一题'}<span class="glyph" aria-hidden="true">↵</span></button>`
    : `<button class="key ink" data-submit ${sel === null ? 'disabled' : ''}>提交答案<span class="glyph" aria-hidden="true">↵</span></button>`
  const hint = state.hints[state.idx]

  <div class="desk">
    <aside class="card-side" aria-label="答题卡">
      <div class="label">答题卡 · 本组 ${QUESTIONS.length} 题</div>
      <div class="answer-card">${QUESTIONS.map((_, i) => `<button class="${cellClass(i)}" data-jump="${i}" aria-label="${cellLabel(i)}">${String(i + 1).padStart(2, '0')}</button>`).join('')}</div>
      <div class="legend"><span><i style="background:var(--paper-3)"></i>已判</span><span><i style="background:var(--red)"></i>判错</span><span><i style="border:1px dashed var(--pen)"></i>草稿</span><span><i style="background:var(--pen);border-radius:50%;width:6px;height:6px"></i>辅助</span></div>
      <section class="side-stats" aria-label="今日学情">
        <div class="label">今日学情</div>
        <div class="kpis"><div><div class="big" id="k-judged">${state.today.judged}<small>题</small></div></div><div><div class="big" id="k-rate">${pct()}<small>%</small></div></div></div>
        ${subjectBars(q.s)}
        <p class="hint-line" id="last-update" aria-live="polite">${esc(state.lastUpdate)}</p>
      </section>
    </aside>

    <article class="sheet-paper">
      <div class="q-meta"><strong>第 ${state.idx + 1} 题</strong><span>共 ${QUESTIONS.length} 题</span><span>${q.s}</span><span>${q.k}</span><span>${q.d}</span></div>

      <div class="act">

/* ---------------- 渲染与交互 ---------------- */
const VIEWS = { login: viewLogin, home: viewHome, practice: viewPractice, done: viewDone, stats: viewStats, wrong: viewWrong, agent: viewAgent, schools: viewSchools, notes: viewNotes }
function route() { const r = location.hash.slice(1); return VIEWS[r] ? r : 'login' }
function render(keepScroll) {
  const y = scrollY
  $('#root').innerHTML = VIEWS[route()]()
  if (keepScroll) scrollTo(0, y)
  else scrollTo(0, 0)
  const now = $('.cell.now')
  if (now) now.scrollIntoView({ block: 'nearest', inline: 'center' })
}
addEventListener('hashchange', () => render(false))

function choose(i) {
  const it = state.items[state.idx]
  if (it.judged || i >= QUESTIONS[state.idx].opts.length) return
  it.draft = i
  render(true)
}
function submit() {
  const it = state.items[state.idx]
  const q = QUESTIONS[state.idx]
  if (it.judged || it.draft === null) return
  it.judged = true
  it.chosen = it.draft
  it.correct = it.chosen === q.a
  it.draft = null
  // 学情实时更新：原型规则为答对 +2、答错 −1；实际由服务端按判分结果计算
  state.today.judged += 1
  if (it.correct) state.today.correct += 1
  if (it.assisted) state.today.assisted += 1
  const before = state.mastery[q.s]
  state.mastery[q.s] = Math.max(0, Math.min(100, before + (it.correct ? 2 : -1)))
  state.lastUpdate = `刚刚更新：第 ${state.idx + 1} 题${it.correct ? '判对' : '判错'}，${q.s} ${before} → ${state.mastery[q.s]}`
  if (!it.correct) state.wrongBook.unshift({ id: 'q' + state.idx, s: q.s, stem: q.stem, when: '刚刚', removed: false })
  render(true)
  ;['#k-judged', '#k-rate', `[data-subj="${q.s}"] b`].forEach(s => { const el = $(s); if (el) el.classList.add('bump') })
}
function move(delta) {
  const n = state.idx + delta
  if (n < 0 || n >= QUESTIONS.length) return
  state.idx = n
  render(true)
}
function next() {
  const pending = state.items.findIndex((it, i) => i > state.idx && !it.judged)
  if (state.idx === QUESTIONS.length - 1 || (pending === -1 && state.items.every(it => it.judged))) { go('done'); return }
  state.idx = pending === -1 ? state.idx + 1 : pending
  render(true)
}

document.addEventListener('click', e => {
  const t = e.target.closest('button, [data-go]')
  if (!t) return
  const d = t.dataset
  if (d.go) { go(d.go); return }
  if (d.toast) { toast(d.toast); return }
  if (d.cfg) {
    const v = d.cfg === 'count' ? Number(d.val) : d.val
    state.cfg[d.cfg] = v
    render(true)
    return
  }
  if ('resetCfg' in d) { state.cfg = { ...state.lastCfg }; render(true); return }
  if ('start' in d) { state.lastCfg = { ...state.cfg }; toast(`已按 ${state.cfg.subject} · ${state.cfg.difficulty} 抽题（原型沿用示例题组）`); go('practice'); return }
  if (d.quick) { state.cfg.subject = d.quick; go('home'); return }
  if (d.jump) { state.idx = Number(d.jump); render(true); return }
  if (d.opt !== undefined) { choose(Number(d.opt)); return }
  if ('submit' in d) { submit(); return }
  if ('next' in d) { next(); return }
  if ('prev' in d) { move(-1); return }
  if ('skip' in d) { move(1); return }
  if (d.ask) {
    const q = QUESTIONS[state.idx]
    const it = state.items[state.idx]
    if (d.ask === 'hint') {
      it.assisted = true
      state.hints[state.idx] = `提示：先确定这题属于“${q.k}”，回忆这一知识点的定义或判定条件，再逐个排除选项。（本题已记为辅助作答）`
    } else {
      state.hints[state.idx] = `这题考查 ${q.s} 中的「${q.k}」，难度${q.d}。`
    }
    render(true)
    return
  }
  if ('summary' in d) {
    const wrong = state.items.filter(i => i.judged && !i.correct).length
    $('#sum-out').textContent = `示例总结：本组有 ${wrong} 题判错，集中在需要按步骤推导的题目。建议先回看错题解析，再用“只做错题”范围练一组。（原型中为固定文案，实际由 Agent 根据作答快照生成）`
    return
  }
  if (d.remove) { const w = state.wrongBook.find(x => x.id === d.remove); if (w) w.removed = true; toast('已移出错题本'); render(true); return }
  if (d.redo) { toast('原型：重做会打开只含这道题的练习'); return }
  if (d.tutor) { state.chat.push({ me: true, text: '帮我讲讲这道错题：' + state.wrongBook.find(x => x.id === d.tutor).stem }); state.chat.push({ me: false, text: '我们先看题目问的是什么，再对照你当时的选择找出偏差。你还记得当时为什么这样选吗？', src: '原型示例回复' }); go('agent'); return }
  if (d.preset) { sendChat(d.preset); return }
  if (d.wf) { state.wrongFilter = d.wf; render(true); return }
  if (d.note) { state.noteId = d.note; render(true); return }
  if ('newNote' in d) { const id = 'n' + Date.now(); state.notes.unshift({ id, title: '未命名笔记', body: '', when: '刚刚' }); state.noteId = id; render(true); $('#note-title').select(); return }
  if ('saveNote' in d) { saveNote(); return }
})

function saveNote() {
  const n = state.notes.find(x => x.id === state.noteId)
  n.title = $('#note-title').value.trim() || '未命名笔记'
  n.body = $('#note-body').value
  n.when = '刚刚'
  render(true)
  toast('笔记已保存（原型仅保存在当前页面）')
}
function sendChat(text) {
  if (!text.trim()) return
  state.chat.push({ me: true, text })
  state.chat.push({ me: false, text: '（原型示例回复）实际会结合你的作答记录和已审核资料回答，并在末尾列出依据来源；资料不足时会直接说明。', src: '原型示例回复' })
  render(true)
  const msgs = $('#msgs')
  if (msgs) msgs.lastElementChild.scrollIntoView({ block: 'end' })
}

document.addEventListener('submit', e => {
  e.preventDefault()
  if (e.target.id === 'login-form') {
    const u = $('#u').value.trim()
    const p = $('#p').value
    if (!u || !p) { $('#login-err').textContent = !u ? '请输入用户名' : '请输入密码'; return }
    state.user = u
    go('home')
    toast('登录成功（原型不校验密码）')
  }
  if (e.target.id === 'chat-form') { sendChat($('#chat-input').value) }
  if (e.target.id === 'school-form') { state.schoolQuery = $('#school-q').value; render(true) }
})

document.addEventListener('input', e => {
  if (e.target.id === 'note-body' || e.target.id === 'note-title') $('#note-state').textContent = '未保存'
})

// 快捷键：刷题页 A–D / 1–4 选择、Enter 提交或下一题、← → 切换；输入框里不生效
document.addEventListener('keydown', e => {
  if (e.metaKey && e.key.toLowerCase() === 's' && route() === 'notes') { e.preventDefault(); saveNote(); return }
  if (e.target.id === 'chat-input' && e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendChat(e.target.value); return }
  if (route() !== 'practice' || e.isComposing || e.metaKey || e.ctrlKey || e.altKey) return
  if (e.target.closest('input, textarea')) return
  const k = e.key.toUpperCase()
  const pressKey = sel => { const el = $(sel); if (el) { el.classList.add('is-down'); setTimeout(() => el.classList.remove('is-down'), 120) } }
  if (/^[A-D]$/.test(k) || /^[1-4]$/.test(k)) { e.preventDefault(); choose(/^[1-4]$/.test(k) ? Number(k) - 1 : LETTERS.indexOf(k)); return }
  if (e.key === 'Enter' && !e.target.closest('button')) {
    e.preventDefault()
    const it = state.items[state.idx]
    if (it.judged) { pressKey('[data-next]'); setTimeout(next, 90) } else if (it.draft !== null) { pressKey('[data-submit]'); setTimeout(submit, 90) }
    return
  }
  if (e.key === 'ArrowLeft') { e.preventDefault(); move(-1) }
  if (e.key === 'ArrowRight') { e.preventDefault(); move(1) }
})

// 直达某个画面：?state=home|practice|judged|done|stats|wrong|agent|schools|notes（方便评审直接打开）
const direct = new URLSearchParams(location.search).get('state')
if (direct && direct !== 'login') {
  state.user = '林同学'
  if (direct === 'judged') {
    state.items[state.idx].draft = 0
    submit()
    location.hash = 'practice'
  } else if (VIEWS[direct]) {
    location.hash = direct
  }
}
render(false)
</script>
</body>
</html>
